<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>刘宣富 & 穆奕彤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF9F5;
      --bg-warm: #FFF5EE;
      --bg-card: #FFFFFF;
      --text: #3D2E2E;
      --text-soft: #8B7070;
      --pink: #E8889A;
      --pink-light: #F4C2CE;
      --pink-bg: #FFF0F3;
      --peach: #F5C6A0;
      --peach-light: #FDDEC8;
      --rose: #D4738B;
      --cream: #FFF8F2;
      --vine: #D4A89A;
      --leaf: #B8C9A3;
      --radius: 14px;
      --serif: 'Noto Serif SC', 'STSong', serif;
      --sans: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img { max-width: 100%; display: block; }

    /* ========== Welcome ========== */
    .welcome {
      position: fixed; inset: 0; z-index: 10000;
      background: #FFFAF7;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
      cursor: pointer; overflow: hidden;
    }
    .welcome.hide { opacity: 0; transform: scale(1.03); pointer-events: none; }

    /* Photo converge - from all directions to center */
    .welcome-tunnel {
      position: absolute; inset: 0; z-index: 0;
      overflow: hidden; pointer-events: none;
    }

    .converge-item {
      position: absolute;
      width: 240px; height: 170px;
      border-radius: 10px; overflow: hidden;
      background: rgba(240,232,228,0.85);
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      opacity: 0;
    }
    .converge-item img { width: 100%; height: 100%; object-fit: cover; }
    .converge-item-ph {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #D4C0B8;
    }

    /* Vignette */
    .welcome-vignette {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 25%, rgba(255,250,247,0.5) 100%);
    }

    .welcome-content { position: relative; z-index: 3; text-align: center; }

    .welcome-heart {
      font-size: 24px; color: #D4738B; margin-bottom: 24px;
      animation: heartBeat 1.5s ease-in-out infinite;
    }
    @keyframes heartBeat {
      0%,100% { transform: scale(1); }
      12% { transform: scale(1.18); }
      24% { transform: scale(1); }
      36% { transform: scale(1.12); }
      48% { transform: scale(1); }
    }

    .welcome-names-wrap {
      min-height: 44px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center;
    }
    .welcome-names {
      font-family: var(--serif);
      font-size: clamp(20px, 5vw, 30px); color: #3D2E2E;
      letter-spacing: 6px; font-weight: 500;
    }
    .welcome-amp {
      color: #D4738B; font-size: 16px; margin: 0 6px;
      font-style: italic; font-weight: 400;
    }
    .welcome-cursor {
      display: inline-block; width: 1.5px; height: 0.9em; background: #D4738B;
      margin-left: 2px; vertical-align: middle; opacity: 0.6;
      animation: cursorBlink 0.8s step-end infinite;
    }
    @keyframes cursorBlink { 0%,100% { opacity: 0.6; } 50% { opacity: 0; } }

    .welcome-sub {
      font-size: 11px; color: #B8A0A0; letter-spacing: 5px;
      font-weight: 400; margin-bottom: 40px; text-transform: uppercase;
    }

    .welcome-btn {
      padding: 11px 36px; background: transparent;
      border: 1px solid #E8D5D5;
      color: #B88090; font-size: 12px; letter-spacing: 3px;
      cursor: pointer; border-radius: 32px; transition: all 0.3s ease;
      font-family: var(--sans); font-weight: 400; opacity: 0;
    }
    .welcome-btn.show { opacity: 1; transition: opacity 0.5s ease; }
    .welcome-btn:hover {
      background: #FFF5F5; border-color: #D4A8B8;
    }

    .welcome-hint {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: #C8B0B0; letter-spacing: 2px;
    }
    .welcome-progress {
      position: absolute; bottom: 0; left: 0; height: 2px;
      background: linear-gradient(90deg, var(--pink), var(--peach));
      width: 0%; transition: width 0.3s ease;
    }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; inset: 0; z-index: 20000;
      background: #FFFAF7;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease;
    }
    .loading-overlay.hide { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid #F0E0D8; border-top-color: var(--pink);
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-pct {
      font-family: var(--serif);
      font-size: 28px; font-weight: 500; color: var(--text);
      margin-bottom: 8px;
    }
    .loading-label {
      font-size: 11px; color: var(--text-soft); letter-spacing: 3px; font-weight: 400;
      margin-bottom: 16px;
    }
    .loading-bar-wrap {
      width: 180px; height: 3px; background: #F0E8E4; border-radius: 2px; overflow: hidden;
    }
    .loading-bar {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--pink), var(--peach));
      border-radius: 2px; transition: width 0.2s ease;
    }

    /* ========== Main ========== */
    .main-content { opacity: 0; transition: opacity 0.7s ease 0.4s; }
    .main-content.show { opacity: 1; }

    /* ========== Vinyl ========== */
    .vinyl {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      width: 48px; height: 48px; cursor: pointer;
      background: #F5EEEA; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      opacity: 0; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .vinyl.show { opacity: 1; transform: scale(1); }
    .vinyl-disc {
      width: 100%; height: 100%; border-radius: 50%;
      background: #E8DDD8;
      position: relative;
      animation: spin 2.8s linear infinite; animation-play-state: paused;
    }
    .vinyl.playing .vinyl-disc { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .vinyl-disc::before {
      content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 1px, rgba(255,255,255,0.4) 1px 2px);
    }
    .vinyl-label {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 12px; height: 12px; border-radius: 50%; background: #D4738B;
    }
    .vinyl-label::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 3px; height: 3px; border-radius: 50%; background: #F5EEEA;
    }
    .vinyl-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 2; pointer-events: none;
    }
    .vinyl-icon svg { width: 12px; height: 12px; fill: #B88090; }
    .vinyl.playing .vinyl-icon { display: none; }
    .vinyl-note { position: absolute; font-size: 9px; opacity: 0; pointer-events: none; color: #D4738B; }
    .vinyl.playing .vinyl-note { animation: noteUp 2.5s ease-out infinite; }
    .vinyl-note:nth-child(1) { top: -5px; right: 2px; }
    .vinyl-note:nth-child(2) { top: -1px; right: -5px; animation-delay: 0.8s; }
    .vinyl-note:nth-child(3) { top: -7px; right: 6px; animation-delay: 1.6s; }
    @keyframes noteUp {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      15% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-20px) translateX(6px) scale(1); }
    }

    /* ========== Hero ========== */
    .hero {
      text-align: center; padding: 0 20px; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
    }
    .hero-glow {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(232,136,154,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-photo {
      width: 100px; height: 100px; border-radius: 50%; overflow: hidden;
      margin-bottom: 24px; position: relative; z-index: 1;
      box-shadow: 0 0 0 2px rgba(232,136,154,0.2), 0 8px 32px rgba(232,136,154,0.1);
      transition: transform 0.4s ease;
    }
    .hero-photo:hover { transform: scale(1.05); }
    .hero-photo img { width: 100%; height: 100%; object-fit: cover; }
    .hero-photo-placeholder {
      width: 100%; height: 100%; background: var(--pink-bg);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(22px, 6vw, 34px); font-weight: 500; letter-spacing: 4px;
      margin-bottom: 6px; color: var(--text); position: relative; z-index: 1;
    }
    .hero-title .amp { color: var(--pink); font-style: italic; margin: 0 4px; }

    .hero-subtitle {
      font-size: 11px; color: var(--pink); letter-spacing: 4px;
      font-weight: 400; margin-bottom: 28px; opacity: 0.6;
    }

    .hero .date-range {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--pink); letter-spacing: 2px; font-weight: 400;
      position: relative; z-index: 1;
    }
    .date-range .line { width: 24px; height: 1px; background: var(--pink-light); }

    .scroll-hint {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      color: var(--pink); animation: bounce 2.5s ease-in-out infinite;
      display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 0.35; z-index: 1;
    }
    .scroll-hint span { font-size: 9px; letter-spacing: 3px; font-weight: 400; }
    .scroll-hint svg { width: 14px; height: 14px; stroke: var(--pink); fill: none; stroke-width: 1.5; }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(5px); }
    }

    /* ========== Timer ========== */
    .timer { text-align: center; padding: 16px 20px 36px; }
    .timer-label {
      font-size: 11px; color: var(--pink); letter-spacing: 4px; font-weight: 400; margin-bottom: 18px; opacity: 0.6;
    }
    .timer-display { display: flex; justify-content: center; align-items: flex-start; gap: 6px; }
    .timer-unit { display: flex; flex-direction: column; align-items: center; }
    .timer-num {
      font-family: var(--serif);
      font-size: clamp(38px, 10vw, 52px); font-weight: 600; color: var(--text);
      letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums;
    }
    .timer-tag {
      font-size: 10px; color: var(--pink); letter-spacing: 2px; margin-top: 6px; font-weight: 400; opacity: 0.5;
    }
    .timer-sep {
      font-family: var(--serif);
      font-size: clamp(30px, 8vw, 42px); font-weight: 400; color: var(--pink-light); line-height: 1;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }
    .timer-date { margin-top: 12px; font-size: 11px; color: var(--text-soft); letter-spacing: 2px; font-weight: 400; opacity: 0.5; }

    /* ========== Stats ========== */
    .stats {
      display: flex; justify-content: center; gap: 0; padding: 0 20px 40px;
      max-width: 440px; margin: 0 auto;
    }
    .stat-item { text-align: center; flex: 1; padding: 0 12px; }
    .stat-num { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--pink); line-height: 1.2; }
    .stat-label { font-size: 9px; color: var(--pink); letter-spacing: 2px; font-weight: 400; margin-top: 4px; opacity: 0.45; }
    .stat-divider { width: 1px; background: var(--pink-light); align-self: stretch; opacity: 0.3; }

    /* ========== Quote ========== */
    .quote-section { text-align: center; padding: 4px 24px 40px; max-width: 440px; margin: 0 auto; }
    .quote-emoji { font-size: 18px; margin-bottom: 10px; }
    .quote-text {
      font-family: var(--serif);
      font-size: 14px; color: var(--text-soft); line-height: 2.2; font-weight: 400; font-style: italic;
    }

    /* ========== Divider ========== */
    .section-divider { text-align: center; padding: 12px 0 32px; }
    .section-divider-ornament { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
    .section-divider-line { width: 32px; height: 1px; background: var(--pink-light); }
    .section-divider-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--pink); opacity: 0.4; }
    .section-divider-text { font-size: 10px; color: var(--pink); letter-spacing: 4px; font-weight: 400; opacity: 0.45; }

    /* ========== Month ========== */
    .month-label { text-align: center; padding: 36px 0 18px; position: relative; z-index: 2; }
    .month-label:first-child { padding-top: 0; }
    .month-label-inner {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 5px 18px; background: var(--bg); border-radius: 18px;
      border: 1px solid rgba(232,136,154,0.12);
    }
    .month-label-text { font-family: var(--serif); font-size: 11px; color: var(--pink); letter-spacing: 2px; font-weight: 500; }
    .month-label-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--pink); opacity: 0.35; }

    /* ========== Timeline ========== */
    .vine-section { position: relative; max-width: 660px; margin: 0 auto; padding: 0 0 60px; }

    /* Center vine line */
    .vine-line {
      position: absolute; top: 0; left: 50%; width: 2px; height: 0;
      background: linear-gradient(180deg, transparent, #D4BFB3 10%, #D4BFB3 90%, transparent);
      transform: translateX(-50%);
      z-index: 0;
      transition: height 0.1s linear;
    }

    /* ========== Card ========== */
    .mem {
      position: relative; z-index: 2; padding: 0 18px 44px;
      display: flex; align-items: flex-start;
    }
    .mem.left { justify-content: flex-start; padding-right: 54%; }
    .mem.right { justify-content: flex-end; padding-left: 54%; }

    .mem-card {
      background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
      border: 1px solid rgba(232,136,154,0.08); width: 100%; opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease;
      position: relative; cursor: pointer;
      box-shadow: 0 2px 10px rgba(232,136,154,0.04);
    }
    .mem.left .mem-card { transform: translateX(-30px); }
    .mem.right .mem-card { transform: translateX(30px); }
    .mem-card.visible { opacity: 1; transform: translateX(0); }
    .mem-card:hover { box-shadow: 0 6px 20px rgba(232,136,154,0.1); }
    .mem-card.highlight { border-color: rgba(232,136,154,0.15); }
    .mem-card.highlight::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--pink), var(--peach)); opacity: 0.5; z-index: 1;
    }

    .mem-card-img {
      width: 100%; aspect-ratio: 16/10; background: var(--pink-bg);
      display: flex; align-items: center; justify-content: center;
    }
    .mem-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .mem-card-img-ph { font-size: 22px; opacity: 0.2; color: var(--pink); }

    .mem-card-body { padding: 12px 14px 14px; }
    .mem-card-date { font-size: 10px; color: var(--pink); letter-spacing: 2px; font-weight: 400; opacity: 0.6; margin-bottom: 3px; }
    .mem-card-title { font-family: var(--serif); font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; }
    .mem-card-hint { font-size: 10px; color: var(--pink); letter-spacing: 1px; margin-top: 5px; opacity: 0.35; }

    .mem-tag {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      font-size: 9px; color: var(--rose); background: rgba(255,255,255,0.92);
      padding: 2px 8px; border-radius: 10px; letter-spacing: 1px; font-weight: 400;
      backdrop-filter: blur(4px); border: 1px solid rgba(232,136,154,0.1);
    }

    /* Dot on the vine line */
    .mem-dot {
      position: absolute; top: 14px; width: 8px; height: 8px;
      background: var(--pink); border-radius: 50%; z-index: 3;
      opacity: 0; transition: opacity 0.4s ease 0.2s;
      box-shadow: 0 0 0 2px rgba(232,136,154,0.15);
      left: 50%; transform: translateX(-50%);
    }
    .mem-card.visible ~ .mem-dot, .mem-dot.visible { opacity: 1; }

    /* Connector line from card to dot */
    .mem-stem {
      position: absolute; top: 17px; height: 1px; background: #C0A090;
      z-index: 1; opacity: 0; transition: opacity 0.4s ease 0.3s, width 0.4s ease 0.3s; width: 0;
    }
    .mem-card.visible ~ .mem-stem, .mem-stem.visible { opacity: 0.45; }
    .mem.left .mem-stem { right: 0; width: 20px !important; }
    .mem.right .mem-stem { left: 0; width: 20px !important; }

    /* ========== Modal ========== */
    .modal-mask {
      position: fixed; inset: 0; z-index: 10001;
      background: rgba(60,40,40,0.3); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      padding: 20px;
    }
    .modal-mask.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--bg-card); border-radius: 18px; max-width: 500px; width: 100%;
      max-height: 85vh; overflow-y: auto; position: relative;
      transform: translateY(16px) scale(0.97); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 16px 48px rgba(0,0,0,0.1);
    }
    .modal-mask.open .modal { transform: translateY(0) scale(1); }

    .modal-close {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.9); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--text-soft);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .modal-close:hover { background: #fff; }

    .modal-img {
      width: 100%; aspect-ratio: 16/10; background: var(--pink-bg);
      display: flex; align-items: center; justify-content: center; border-radius: 18px 18px 0 0;
      overflow: hidden;
    }
    .modal-img img { width: 100%; height: 100%; object-fit: cover; }
    .modal-img-ph { font-size: 28px; opacity: 0.12; color: var(--pink); }

    .modal-gallery { display: grid; gap: 4px; }
    .modal-gallery.g2 { grid-template-columns: 1fr 1fr; }
    .modal-gallery.g3 { grid-template-columns: 1fr 1fr; }
    .modal-gallery-item {
      aspect-ratio: 1; background: var(--pink-bg);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .modal-gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .modal-body { padding: 22px 24px 26px; }
    .modal-date { font-size: 11px; color: var(--pink); letter-spacing: 2px; font-weight: 400; opacity: 0.6; margin-bottom: 6px; }
    .modal-title { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 10px; }
    .modal-text { font-size: 14px; color: var(--text-soft); line-height: 2; font-weight: 400; }
    .modal-tag {
      display: inline-block; font-size: 10px; color: var(--rose);
      background: var(--pink-bg); padding: 3px 10px; border-radius: 10px;
      letter-spacing: 1px; margin-top: 12px; font-weight: 400;
    }

    /* ========== Footer ========== */
    .footer { text-align: center; padding: 44px 20px 20px; }
    .footer-line { width: 1px; height: 28px; background: var(--pink-light); margin: 0 auto 14px; }
    .footer p { color: var(--pink); font-size: 10px; letter-spacing: 3px; font-weight: 400; opacity: 0.45; }
    .footer .footer-names {
      font-family: var(--serif); font-size: 16px; color: var(--text); margin-top: 8px;
      letter-spacing: 4px; font-weight: 500;
    }
    .footer .footer-heart { display: inline-block; color: var(--pink); font-size: 11px; margin: 0 4px; animation: heartBeat 1.5s ease-in-out infinite; }
    .footer .footer-year { font-size: 10px; color: var(--pink); margin-top: 12px; letter-spacing: 2px; font-weight: 400; opacity: 0.3; }

    /* Ending tree scene */
    .ending { position: relative; height: 360px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; background: linear-gradient(180deg, #FFF9F5 0%, #FFF0EB 60%, #FFE8E0 100%); }
    .tree-svg { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 100%; }
    .tree-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Fireworks canvas */
    .fireworks-canvas {
      position: fixed; inset: 0; z-index: 10002;
      width: 100%; height: 100%;
      pointer-events: none; display: none;
      background: transparent;
    }

    .tree-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--pink); letter-spacing: 2px; opacity: 0.4;
      white-space: nowrap; animation: hintPulse 2.5s ease-in-out infinite; z-index: 1;
    }
    @keyframes hintPulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.55; } }

    /* Final black screen */
    .final-screen {
      position: fixed; inset: 0; z-index: 10003;
      background: #0A0A0A;

  <script>
    var START_DATE = new Date('2025-10-21');

    // Audio loading - single fetch + decode with progress
    (function () {
      var overlay = document.getElementById('loadingOverlay');
      var pctEl = document.getElementById('loadingPct');
      var bar = document.getElementById('loadingBar');
      var dismissed = false;

      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        bar.style.width = '100%';
        pctEl.textContent = '100%';
        setTimeout(function () {
          overlay.classList.add('hide');
          setTimeout(function () { overlay.style.display = 'none'; }, 600);
        }, 400);
      }

      // Fetch with progress tracking
      fetch('music.mp3').then(function (r) {
        if (!r.ok) throw new Error('fetch failed');
        var reader = r.body.getReader();
        var total = parseInt(r.headers.get('Content-Length') || '2900000');
        var received = 0;
        var chunks = [];
        function readChunk() {
          return reader.read().then(function (result) {
            if (result.done) {
              // Merge all chunks into one ArrayBuffer
              var merged = new Uint8Array(received);
              var offset = 0;
              chunks.forEach(function (c) { merged.set(c, offset); offset += c.length; });
              return merged.buffer;
            }
            chunks.push(result.value);
            received += result.value.length;
            var pct = Math.min(Math.floor((received / total) * 90), 90);
            bar.style.width = pct + '%';
            pctEl.textContent = pct + '%';
            return readChunk();
          });
        }
        return readChunk();
      }).then(function (arrayBuf) {
        bar.style.width = '92%';
        pctEl.textContent = '92%';
        // Decode audio
        var AC = window.AudioContext || window.webkitAudioContext;
        window.__audioCtx = new AC();
        return window.__audioCtx.decodeAudioData(arrayBuf);
      }).then(function (decoded) {
        window.__audioBuffer = decoded;
        bar.style.width = '100%';
        pctEl.textContent = '100%';
        dismiss();
      }).catch(function (e) {
        console.error('Audio load failed:', e);
        // Still dismiss so user can enter
        dismiss();
      });

      // Safety timeout
      setTimeout(dismiss, 12000);
    })();

    // Welcome photo converge - photos fly from edges to center and vanish
    (function () {
      var photos = [
        'images/couple.jpg',
        'images/photo202607251603093766.jpg',
        'images/photo202607251604494066.jpg',
        'images/photo202607251604504166.jpg',
        'images/photo202607251605164266.jpg',
        'images/photo202607251606284366.jpg',
        'images/photo202607251606294466.jpg',
        'images/photo202607251606304566.jpg',
        'images/photo202607251607484966.jpg'
      ];

      var tunnel = document.getElementById('tunnel');
      if (!tunnel) return;

      var photoIdx = 0;

      function spawn() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var cx = w / 2;
        var cy = h / 2;

        // Random start position on edges
        var side = Math.floor(Math.random() * 4); // 0=top,1=right,2=bottom,3=left
        var startX, startY;
        if (side === 0) { startX = Math.random() * w; startY = -80; }
        else if (side === 1) { startX = w + 80; startY = Math.random() * h; }
        else if (side === 2) { startX = Math.random() * w; startY = h + 80; }
        else { startX = -80; startY = Math.random() * h; }

        var isMob = window.innerWidth <= 640;
        var item = document.createElement('div');
        item.className = 'converge-item';
        item.style.left = startX + 'px';
        item.style.top = startY + 'px';
        if (!isMob) {
          item.style.width = (200 + Math.random() * 120) + 'px';
          item.style.height = (140 + Math.random() * 80) + 'px';
        }

        var src = photos[photoIdx % photos.length];
        photoIdx++;
        item.innerHTML = src ? '<img src="' + src + '" loading="lazy">' : '<div class="converge-item-ph">&#128247;</div>';
        tunnel.appendChild(item);

        // Animate towards a random point within a circle around center
        var duration = 4500 + Math.random() * 3000;
        var angle = Math.random() * Math.PI * 2;
        var radius = Math.random() * 120;
        var targetX = cx + Math.cos(angle) * radius;
        var targetY = cy + Math.sin(angle) * radius;
        var start = performance.now();

        function animate(now) {
          var t = Math.min((now - start) / duration, 1);
          // Ease in-out
          var ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

          var x = startX + (targetX - startX) * ease;
          var y = startY + (targetY - startY) * ease;
          var scale = 1 - ease * 0.85; // shrink as it approaches center
          var opacity = t < 0.15 ? t / 0.15 * 0.55 : (t > 0.7 ? (1 - t) / 0.3 * 0.55 : 0.55);

          item.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
          item.style.left = x + 'px';
          item.style.top = y + 'px';
          item.style.opacity = opacity;

          if (t < 1) {
            requestAnimationFrame(animate);
          } else {
            item.remove();
          }
        }

        requestAnimationFrame(animate);
      }

      // Spawn photos continuously
      function loop() {
        spawn();
        setTimeout(loop, 600 + Math.random() * 500);
      }
      loop();
    })();

    // Data + Timeline + Modal

        "hero":{"img":"","startDate":"2025.10.21","quote":"2025.10.21 认识，2026.03.07 在一起<br>以后的每一天，都是我们的故事","names":"刘宣富 & 穆奕彤"},
        "memories":[
          {"date":"2025 / 10 / 21","title":"初次相遇","text":"茫茫人海中，我们的目光第一次交汇。那一天，命运悄悄写下了一个开始。","img":"","highlight":true,"tag":"起点"},
          {"date":"2025 / 10 / 29","title":"你的休闲时刻","text":"随手拍的一张，穿着随意，笑容自然。就这么一张照片，我设了好几天壁纸。朋友问我屏幕上的女孩是谁，我笑着说——一个让我心动的人。","img":"images/10.29.jpg"},
          {"date":"2025 / 11 / 01","title":"一个小玩偶","text":"那段时间你一直想见我，可我忙着比赛抽不开身。于是我送了你一只小玩偶，想让它代替我陪在你身边。你抱着它的时候，就像我也在。睹物思人，这四个字在那一刻有了温度。","img":"images/1.jpg","highlight":true,"tag":"礼物"},
          {"date":"2025 / 11 / 10","title":"天桥小雨","text":"那天傍晚下着小雨，我们走在天桥上。你撑着伞，我觉得那个画面特别好看，就随手拍了一张。后来再看这张照片，才发现好看的根本不是风景，是你站在雨里的样子。","img":"images/2.jpg"},
          {"date":"2025 / 11 / 20","title":"电玩城历险","text":"那天去电玩城，电脑老卡了一直死机，我俩面面相觑哭笑不得。后来去玩双人成行，你不太会操作，手忙脚乱的样子比游戏本身还好玩。虽然什么都没通关，但和你在一起连死机都是开心的。","img":"images/11.20.jpg"},
          {"date":"2025 / 11","title":"教室里的你","text":"你从教室里给我发了这张照片，大大的眼睛看着镜头，我还记得你那件经典的大衣。后来你还发了抖音，评论区都在夸好看，但只有我知道，这张照片是专门发给我的。","img":"images/3.jpg"},
          {"date":"2025 / 11 / 27","title":"迎新公园","text":"那天我们一起去迎新公园，两个人躺在一起刷抖音。你的肩膀刚好够我靠着，屏幕里的视频一帧帧划过，可我记住的只有靠在你肩上的温度。","img":"images/4.jpg","highlight":true,"tag":"约会"},

          {"date":"2026 / 06 / 21","title":"端午节烧烤","text":"端午节那天去吃了漠上羊烧烤，巨好吃也巨贵。但管它呢，和你在一起的每一天都值得庆祝。那天特别特别特别开心，连空气都是甜的。","img":"images/6.21.jpg","highlight":true,"tag":"节日"},
          {"date":"2026 / 07 / 03","title":"狂妄的笑容","text":"走在路上随手一抓拍，你笑得特别狂妄，毫无形象可言。但就是这种毫不设防的样子，才是我最爱的你。","img":"images/7.3.jpg"},

      document.getElementById('statMemories').textContent = DATA.memories.length;

          var parts = item.date.split('/');

          if (month !== lastMonth) {

            var mn = {'2025/10':'2025 年 10 月','2025/11':'2025 年 11 月','2025/12':'2025 年 12 月',
              '2026/01':'2026 年 1 月','2026/02':'2026 年 2 月','2026/03':'2026 年 3 月',
              '2026/04':'2026 年 4 月','2026/05':'2026 年 5 月','2026/06':'2026 年 6 月','2026/07':'2026 年 7 月'};
            container.insertAdjacentHTML('beforeend',
              '<div class="month-label"><div class="month-label-inner"><div class="month-label-dot"></div><div class="month-label-text">'+(mn[month]||month)+'</div><div class="month-label-dot"></div></div></div>');
          }

          var imgHtml = item.img
            ? '<div class="mem-card-img"><img src="'+item.img+'" loading="lazy"></div>'
            : '<div class="mem-card-img"><div class="mem-card-img-ph">&#128247;</div></div>';
          var tagHtml = item.tag ? '<div class="mem-tag">'+item.tag+'</div>' : '';

          container.insertAdjacentHTML('beforeend',
            '<div class="mem '+side+'" data-idx="'+i+'">'
            + '<div class="mem-card'+hl+'" data-idx="'+i+'">'
            + imgHtml
            + '<div class="mem-card-body">'
            + '<div class="mem-card-date">'+item.date+'</div>'
            + '<div class="mem-card-title">'+item.title+'</div>'
            + '<div class="mem-card-hint">点击查看详情 &rsaquo;</div>'
            + '</div>' + tagHtml
            + '</div><div class="mem-dot"></div><div class="mem-stem"></div></div>');
        });

        container.querySelectorAll('.mem-card').forEach(function (card) {
          card.addEventListener('click', function () {
            openModal(data[parseInt(card.dataset.idx)]);
          });
        });
      }

      // Modal
      var mask = document.getElementById('modalMask');
      function openModal(item) {
        document.getElementById('modalImg').innerHTML = item.img
          ? '<img src="'+item.img+'" alt="'+item.title+'">'
          : '<div class="modal-img-ph">&#128247;</div>';
        if (item.gallery && item.gallery.length > 0) {
          var gc = item.gallery.length >= 3 ? 'g3' : 'g2';
          var gh = '<div class="modal-gallery '+gc+'">';
          item.gallery.forEach(function (g) {
            gh += '<div class="modal-gallery-item">' + (g ? '<img src="'+g+'" loading="lazy">' : '<div class="modal-img-ph" style="font-size:18px">&#128247;</div>') + '</div>';
          });
          document.getElementById('modalGallery').innerHTML = gh + '</div>';
        } else {
          document.getElementById('modalGallery').innerHTML = '';
        }
        document.getElementById('modalDate').textContent = item.date;
        document.getElementById('modalTitle').textContent = item.title;
        document.getElementById('modalText').textContent = item.text;
        document.getElementById('modalTag').innerHTML = item.tag ? '<div class="modal-tag">'+item.tag+'</div>' : '';
        mask.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeModal() { mask.classList.remove('open'); document.body.style.overflow = ''; }
      document.getElementById('modalClose').addEventListener('click', closeModal);
      mask.addEventListener('click', function (e) { if (e.target === mask) closeModal(); });

      // Init
      (function () {
        var h = DATA.hero;
        if (h.img) {
          document.getElementById('heroPlaceholder').style.display = 'none';
          var img = document.createElement('img'); img.src = h.img; img.alt = '我们';
          document.getElementById('heroPhoto').appendChild(img);
        }
        if (h.startDate) document.getElementById('heroStartDate').textContent = h.startDate;
        if (h.quote) document.getElementById('quoteText').innerHTML = h.quote;
        if (h.startDate) START_DATE = new Date(h.startDate);
        loadMemories(DATA.memories);
      })();

      // Scroll: vine line grows + cards appear
      var vineLine = document.getElementById('vineLine');
      var memEls = document.querySelectorAll('.mem');
      var memCards = document.querySelectorAll('.mem-card');
      var memDots = document.querySelectorAll('.mem-dot');
      var memStems = document.querySelectorAll('.mem-stem');

      function onScroll() {
        var rect = section.getBoundingClientRect();
        var viewH = window.innerHeight;

        // Grow vine line
        var scrolled = Math.max(0, -rect.top + viewH * 0.5);
        var total = rect.height;
        var progress = Math.min(scrolled / total, 1);
        vineLine.style.height = (progress * total) + 'px';

        // Reveal cards
        memEls.forEach(function (item, i) {
          if (item.getBoundingClientRect().top < viewH * 0.82) {
            if (memCards[i]) memCards[i].classList.add('visible');
            if (memDots[i]) memDots[i].classList.add('visible');
            if (memStems[i]) memStems[i].classList.add('visible');
          }
        });
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();

    // Progress
    (function () {
      var bar = document.getElementById('progressBar');
      window.addEventListener('scroll', function () {
        var h = document.documentElement;
        bar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
      }, { passive: true });
    })();

    // Back top
    (function () {
      var btn = document.getElementById('backTop');
      window.addEventListener('scroll', function () { btn.classList.toggle('show', window.scrollY > 400); }, { passive: true });
      btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    })();

    // Ending: SVG cherry blossom tree + canvas petals + fireworks + final screen
    (function () {
      var endingEl = document.getElementById('endingSection');
      var treeSvg = document.getElementById('treeSvg');
      var treeCanvas = document.getElementById('treeCanvas');
      var tctx = treeCanvas.getContext('2d');
      var fwCanvas = document.getElementById('fireworksCanvas');
      var fctx = fwCanvas.getContext('2d');
      var hint = document.getElementById('treeHint');
      var finalScreen = document.getElementById('finalScreen');
      var clickCount = 0;
      var sparks = [];
      var petals = [];

      // Size canvases
      function sizeCanvases() {
        treeCanvas.width = endingEl.offsetWidth;
        treeCanvas.height = endingEl.offsetHeight;
        fwCanvas.width = window.innerWidth;
        fwCanvas.height = window.innerHeight;
      }
      sizeCanvases();
      window.addEventListener('resize', sizeCanvases);

      // ===== SVG Cherry Blossom Tree =====
      function buildSvgTree() {
        var ns = 'http://www.w3.org/2000/svg';
        treeSvg.innerHTML = '';

        // Defs for gradients and filters
        var defs = document.createElementNS(ns, 'defs');

        // Trunk gradient
        var tg = document.createElementNS(ns, 'linearGradient');
        tg.setAttribute('id', 'trunkGrad');
        tg.setAttribute('x1', '0'); tg.setAttribute('y1', '0');
        tg.setAttribute('x2', '1'); tg.setAttribute('y2', '0');
        var s1 = document.createElementNS(ns, 'stop');
        s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', '#6B4226');
        var s2 = document.createElementNS(ns, 'stop');
        s2.setAttribute('offset', '50%'); s2.setAttribute('stop-color', '#8B5E3C');
        var s3 = document.createElementNS(ns, 'stop');
        s3.setAttribute('offset', '100%'); s3.setAttribute('stop-color', '#5C3A1E');
        tg.appendChild(s1); tg.appendChild(s2); tg.appendChild(s3);
        defs.appendChild(tg);

        // Blossom gradient
        var bg = document.createElementNS(ns, 'radialGradient');
        bg.setAttribute('id', 'blossomGrad');
        var bs1 = document.createElementNS(ns, 'stop');
        bs1.setAttribute('offset', '0%'); bs1.setAttribute('stop-color', '#FFFFFF'); bs1.setAttribute('stop-opacity', '0.6');
        var bs2 = document.createElementNS(ns, 'stop');
        bs2.setAttribute('offset', '100%'); bs2.setAttribute('stop-color', '#F4A0B5');
        bg.appendChild(bs1); bg.appendChild(bs2);
        defs.appendChild(bg);

        // Glow filter for blossoms
        var filter = document.createElementNS(ns, 'filter');
        filter.setAttribute('id', 'blossomGlow');
        filter.setAttribute('x', '-50%'); filter.setAttribute('y', '-50%');
        filter.setAttribute('width', '200%'); filter.setAttribute('height', '200%');
        var blur = document.createElementNS(ns, 'feGaussianBlur');
        blur.setAttribute('in', 'SourceGraphic'); blur.setAttribute('stdDeviation', '1.5');
        filter.appendChild(blur);
        defs.appendChild(filter);

        treeSvg.appendChild(defs);

        // Ground shadow
        var ground = document.createElementNS(ns, 'ellipse');
        ground.setAttribute('cx', '200'); ground.setAttribute('cy', '358');
        ground.setAttribute('rx', '90'); ground.setAttribute('ry', '8');
        ground.setAttribute('fill', 'rgba(180,140,120,0.12)');
        treeSvg.appendChild(ground);

        // Trunk - curved path
        var trunk = document.createElementNS(ns, 'path');
        trunk.setAttribute('d', 'M200,355 C198,330 195,290 197,260 C199,230 201,210 200,190');
        trunk.setAttribute('stroke', 'url(#trunkGrad)');
        trunk.setAttribute('stroke-width', '14');
        trunk.setAttribute('fill', 'none');
        trunk.setAttribute('stroke-linecap', 'round');
        treeSvg.appendChild(trunk);

        // Main branches
        var branches = [
          { d: 'M200,210 C195,195 175,170 155,145', w: 7 },
          { d: 'M200,210 C205,195 225,170 245,145', w: 7 },
          { d: 'M200,230 C190,220 165,195 140,175', w: 5.5 },
          { d: 'M200,230 C210,220 235,195 260,175', w: 5.5 },
          { d: 'M200,200 C198,185 195,165 190,135', w: 5 },
          { d: 'M200,250 C188,240 160,220 135,205', w: 4 },
          { d: 'M200,250 C212,240 240,220 265,205', w: 4 },
          { d: 'M155,145 C145,130 125,115 110,105', w: 3 },
          { d: 'M155,145 C150,125 140,105 130,85', w: 3 },
          { d: 'M245,145 C255,130 275,115 290,105', w: 3 },
          { d: 'M245,145 C250,125 260,105 270,85', w: 3 },
          { d: 'M140,175 C130,165 115,150 100,140', w: 2.5 },
          { d: 'M260,175 C270,165 285,150 300,140', w: 2.5 },
          { d: 'M190,135 C185,120 175,100 165,85', w: 2.5 },
          { d: 'M190,135 C195,115 188,95 180,75', w: 2.5 },
          { d: 'M135,205 C125,195 110,185 95,178', w: 2 },
          { d: 'M265,205 C275,195 290,185 305,178', w: 2 },
        ];

        branches.forEach(function (b) {
          var p = document.createElementNS(ns, 'path');
          p.setAttribute('d', b.d);
          p.setAttribute('stroke', '#7B5230');
          p.setAttribute('stroke-width', b.w);
          p.setAttribute('fill', 'none');
          p.setAttribute('stroke-linecap', 'round');
          treeSvg.appendChild(p);
        });

        // Cherry blossom clusters
        var blossomPositions = [
          // Left canopy
          { x: 110, y: 100, r: 18 }, { x: 130, y: 80, r: 15 }, { x: 100, y: 125, r: 14 },
          { x: 125, y: 110, r: 12 }, { x: 140, y: 95, r: 16 },
          { x: 145, y: 135, r: 13 }, { x: 115, y: 140, r: 11 },
          { x: 160, y: 140, r: 10 }, { x: 135, y: 155, r: 9 },
          // Right canopy
          { x: 290, y: 100, r: 18 }, { x: 270, y: 80, r: 15 }, { x: 300, y: 125, r: 14 },
          { x: 275, y: 110, r: 12 }, { x: 260, y: 95, r: 16 },
          { x: 255, y: 135, r: 13 }, { x: 285, y: 140, r: 11 },
          { x: 240, y: 140, r: 10 }, { x: 265, y: 155, r: 9 },
          // Top canopy
          { x: 165, y: 80, r: 16 }, { x: 180, y: 70, r: 14 }, { x: 195, y: 60, r: 17 },
          { x: 210, y: 65, r: 15 }, { x: 225, y: 75, r: 16 }, { x: 235, y: 80, r: 14 },
          { x: 200, y: 50, r: 12 }, { x: 190, y: 55, r: 10 },
          // Mid sections
          { x: 150, y: 160, r: 11 }, { x: 250, y: 160, r: 11 },
          { x: 175, y: 130, r: 13 }, { x: 225, y: 130, r: 13 },
          { x: 95, y: 170, r: 10 }, { x: 305, y: 170, r: 10 },
          { x: 130, y: 185, r: 9 }, { x: 270, y: 185, r: 9 },
          // Extra scattered blossoms
          { x: 155, y: 105, r: 8 }, { x: 245, y: 105, r: 8 },
          { x: 185, y: 85, r: 9 }, { x: 215, y: 85, r: 9 },
          { x: 200, y: 75, r: 11 },
        ];

        var petalColors = ['#F8B4C8', '#FADCE6', '#F5A0B8', '#FFD0DE', '#F0A0BC', '#FFC8D8'];

        // Draw a single cherry blossom petal path (round with slight notch)
        function drawPetal(cx, cy, angle, size, color, opacity) {
          var ns = 'http://www.w3.org/2000/svg';
          // Petal shape: wider at base, rounded tip, slight inward curve on sides
          var len = size;
          var wid = size * 0.55;
          // Points relative to center, rotated by angle
          var cos = Math.cos(angle), sin = Math.sin(angle);
          function pt(lx, ly) {
            return (cx + lx * cos - ly * sin).toFixed(1) + ',' + (cy + lx * sin + ly * cos).toFixed(1);
          }
          var d = 'M' + pt(0, 0)
            + ' C' + pt(len * 0.2, -wid * 0.8) + ' ' + pt(len * 0.7, -wid * 0.9) + ' ' + pt(len, 0)
            + ' C' + pt(len * 0.7, wid * 0.9) + ' ' + pt(len * 0.2, wid * 0.8) + ' ' + pt(0, 0)
            + 'Z';
          var petal = document.createElementNS(ns, 'path');
          petal.setAttribute('d', d);
          petal.setAttribute('fill', color);
          petal.setAttribute('opacity', opacity);
          treeSvg.appendChild(petal);
        }

        blossomPositions.forEach(function (bp) {
          // Glow circle behind
          var glow = document.createElementNS(ns, 'circle');
          glow.setAttribute('cx', bp.x); glow.setAttribute('cy', bp.y);
          glow.setAttribute('r', bp.r + 5);
          glow.setAttribute('fill', 'rgba(248,180,200,0.12)');
          treeSvg.appendChild(glow);

          // Draw 5 cherry blossom petals
          var petalCount = 5;
          var petalLen = bp.r * 0.85;
          for (var p = 0; p < petalCount; p++) {
            var angle = (Math.PI * 2 * p) / petalCount - Math.PI / 2;
            var color = petalColors[Math.floor(Math.random() * petalColors.length)];
            var opacity = (0.65 + Math.random() * 0.35).toFixed(2);
            drawPetal(bp.x, bp.y, angle, petalLen, color, opacity);
          }
          // Center pistil
          var center = document.createElementNS(ns, 'circle');
          center.setAttribute('cx', bp.x); center.setAttribute('cy', bp.y);
          center.setAttribute('r', bp.r * 0.12);
          center.setAttribute('fill', '#E8789A');
          center.setAttribute('opacity', '0.8');
          treeSvg.appendChild(center);
          // Small stamen dots
          for (var s = 0; s < 3; s++) {
            var sa = Math.random() * Math.PI * 2;
            var sd = bp.r * 0.18;
            var dot = document.createElementNS(ns, 'circle');
            dot.setAttribute('cx', (bp.x + Math.cos(sa) * sd).toFixed(1));
            dot.setAttribute('cy', (bp.y + Math.sin(sa) * sd).toFixed(1));
            dot.setAttribute('r', '1');
            dot.setAttribute('fill', '#D4738B');
            dot.setAttribute('opacity', '0.5');
            treeSvg.appendChild(dot);
          }
        });
      }

      buildSvgTree();

      // ===== Falling petals (canvas overlay) =====
      function spawnPetal() {
        var w = treeCanvas.width;
        petals.push({
          x: w * 0.15 + Math.random() * w * 0.7,
          y: -8,
          size: 3 + Math.random() * 4,
          speedY: 0.4 + Math.random() * 0.8,
          speedX: (Math.random() - 0.5) * 0.6,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.04,
          opacity: 0.4 + Math.random() * 0.4,
          color: ['#F8B4C8','#FADCE6','#F5A0B8','#FFD0DE','#FFC8D8'][Math.floor(Math.random() * 5)]
        });
      }

      function updatePetals() {
        var w = treeCanvas.width, h = treeCanvas.height;
        tctx.clearRect(0, 0, w, h);

        for (var i = petals.length - 1; i >= 0; i--) {
          var p = petals[i];
          p.x += p.speedX + Math.sin(p.y * 0.008 + p.rotation) * 0.4;
          p.y += p.speedY;
          p.rotation += p.rotSpeed;
          // Gentle sway
          p.speedX += Math.sin(p.y * 0.01) * 0.01;

          if (p.y > h + 10) { petals.splice(i, 1); continue; }

          tctx.save();
          tctx.translate(p.x, p.y);
          tctx.rotate(p.rotation);
          tctx.globalAlpha = p.opacity;
          tctx.fillStyle = p.color;
          // Draw petal shape (ellipse with pointed ends)
          tctx.beginPath();
          tctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
          tctx.fill();
          tctx.restore();
        }

        if (Math.random() < 0.1) spawnPetal();
      }

      // ===== Fireworks =====
      var palettes = [
        ['#FF6B8A','#FFB3C1','#FFD6E0','#FFFFFF'],
        ['#FFB347','#FFCC80','#FFE0B2','#FFFFFF'],
        ['#FF69B4','#FFB6C1','#FFD6E0','#FFFFFF'],
        ['#FFD700','#FFEC8B','#FFFACD','#FFFFFF'],
        ['#DDA0DD','#E8A0E8','#F0D0F0','#FFFFFF'],
        ['#FF8A9E','#FFC0CB','#FFE4E9','#FFFFFF']
      ];

      var launchCount = 0;

      function launchBurst() {
        fwCanvas.style.display = 'block';
        var palette = palettes[Math.floor(Math.random() * palettes.length)];
        var cx = fwCanvas.width * (0.2 + Math.random() * 0.6);
        var cy = fwCanvas.height * (0.15 + Math.random() * 0.3);
        var count = 60 + Math.floor(Math.random() * 40);
        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
          var speed = 1.5 + Math.random() * 3.5;
          sparks.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1, decay: 0.008 + Math.random() * 0.006,
            color: palette[Math.floor(Math.random() * palette.length)],
            size: 1 + Math.random() * 1.5, trail: []
          });
        }
        launchCount++;
      }

      function launchFinale() {
        // Launch multiple bursts in sequence
        for (var b = 0; b < 5; b++) {
          (function (delay) {
            setTimeout(function () { launchBurst(); }, delay);
          })(b * 400);
        }
      }

      function updateFireworks() {
        if (sparks.length === 0) return;
        fctx.fillStyle = 'rgba(0,0,0,0.12)';
        fctx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);

        for (var i = sparks.length - 1; i >= 0; i--) {
          var s = sparks[i];
          s.trail.push({ x: s.x, y: s.y });
          if (s.trail.length > 8) s.trail.shift();

          // Draw trail
          for (var ti = 0; ti < s.trail.length; ti++) {
            var t = s.trail[ti];
            var ratio = ti / s.trail.length;
            fctx.beginPath();
            fctx.arc(t.x, t.y, s.size * 0.4 * ratio, 0, Math.PI * 2);
            fctx.fillStyle = s.color;
            fctx.globalAlpha = ratio * s.life * 0.3;
            fctx.fill();
          }
          fctx.globalAlpha = 1;

          s.x += s.vx; s.y += s.vy;
          s.vy += 0.02; s.vx *= 0.997;
          s.life -= s.decay;

          if (s.life > 0) {
            // Glow
            fctx.beginPath();
            fctx.arc(s.x, s.y, s.size * 5, 0, Math.PI * 2);
            fctx.fillStyle = s.color;
            fctx.globalAlpha = s.life * 0.05;
            fctx.fill();
            fctx.globalAlpha = 1;

            // Core
            fctx.beginPath();
            fctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
            fctx.fillStyle = s.color;
            fctx.globalAlpha = s.life * 0.95;
            fctx.fill();
            fctx.globalAlpha = 1;
          } else {
            sparks.splice(i, 1);
          }
        }
      }

      // ===== Animation loop =====
      function animate() {
        updatePetals();
        updateFireworks();
        requestAnimationFrame(animate);
      }
      animate();

      // ===== Click tree =====
      var clickTarget = document.getElementById('endingSection');
      clickTarget.style.cursor = 'pointer';
      clickTarget.addEventListener('click', function (e) {
        // Don't trigger if clicking the hint
        if (e.target === hint) return;
        clickCount++;
        launchBurst();

        if (clickCount === 1) {
          hint.textContent = '再点两下许愿';
        } else if (clickCount === 2) {
          hint.textContent = '再点一下';
        }

        if (clickCount >= 3) {
          hint.style.opacity = '0';
          launchFinale();
          // Show final screen after fireworks finish
          function checkDone() {
            if (sparks.length === 0) {
              finalScreen.classList.add('show');
              setTimeout(function () { fwCanvas.style.display = 'none'; }, 1500);
            } else {
              setTimeout(checkDone, 300);
            }
          }
          setTimeout(checkDone, 2500);
        }
      });
    })();

    // Music - uses shared audioCtx + audioBuffer from loading section
    (function () {
      var vinyl = document.getElementById('vinylPlayer');
      var sourceNode = null;
      var playing = false;

      function startPlayback() {
        var audioCtx = window.__audioCtx;
        var audioBuffer = window.__audioBuffer;
        if (!audioCtx || !audioBuffer) return false;

        sourceNode = audioCtx.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.loop = true;
        sourceNode.connect(audioCtx.destination);
        sourceNode.start(0);
        playing = true;
        vinyl.classList.add('playing');
        return true;
      }

      window.__playMusic = function () {
        if (playing) return;
        var audioCtx = window.__audioCtx;
        var audioBuffer = window.__audioBuffer;
        if (!audioCtx || !audioBuffer) {
          console.warn('Audio not ready yet');
          return;
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().then(function () {
            startPlayback();
          }).catch(function (e) {
            console.error('AudioContext resume failed:', e);
          });
        } else {
          startPlayback();
        }
      };

      window.__stopMusic = function () {
        if (sourceNode) {
          try { sourceNode.stop(); } catch (e) {}
          sourceNode = null;
        }
        playing = false;
        vinyl.classList.remove('playing');
      };

      vinyl.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (playing) {
          window.__stopMusic();
        } else {
          window.__playMusic();
        }
      });
    })();
  </script>
