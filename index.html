<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>刘宣富 & 穆奕彤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF8F5;
      --bg-card: #FFFFFF;
      --text: #1A1714;
      --text-secondary: #7A7068;
      --gold: #C9A96E;
      --gold-light: #E8D5A8;
      --gold-dark: #8B6F3A;
      --gold-bg: linear-gradient(135deg, #C9A96E 0%, #E8D5A8 50%, #C9A96E 100%);
      --cream: #F5F0E8;
      --warm: #D4A574;
      --vine: #B8A88A;
      --leaf: #9AB07A;
      --shadow: rgba(0,0,0,0.04);
      --radius: 16px;
      --serif: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', serif;
      --sans: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img { max-width: 100%; display: block; }

    /* ========== Welcome Page ========== */
    .welcome {
      position: fixed; inset: 0; z-index: 10000;
      background: #0A0806;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1.2s cubic-bezier(0.4,0,0.2,1), transform 1.2s cubic-bezier(0.4,0,0.2,1);
      cursor: pointer; overflow: hidden;
    }
    .welcome.hide {
      opacity: 0; transform: scale(1.1);
      pointer-events: none;
    }

    .welcome-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.35;
    }
    .welcome-bg-fallback {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 20%, #2D1F0E 0%, #0A0806 60%),
                  radial-gradient(ellipse at 70% 80%, #1A1208 0%, transparent 60%);
    }

    .welcome-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,8,6,0.2) 0%, rgba(10,8,6,0.5) 100%);
    }

    .welcome-particles {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
    }
    .welcome-particle {
      position: absolute; border-radius: 50%;
      opacity: 0; animation: floatUp 10s ease-in infinite;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0); }
      10% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-600px) scale(1.5); }
    }

    /* Decorative corner ornaments */
    .welcome-ornament {
      position: absolute; z-index: 2; opacity: 0.15;
    }
    .welcome-ornament svg { width: 80px; height: 80px; stroke: var(--gold); fill: none; stroke-width: 0.5; }
    .welcome-ornament.tl { top: 24px; left: 24px; }
    .welcome-ornament.tr { top: 24px; right: 24px; transform: scaleX(-1); }
    .welcome-ornament.bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
    .welcome-ornament.br { bottom: 24px; right: 24px; transform: scale(-1); }

    .welcome-content {
      position: relative; z-index: 3; text-align: center;
    }

    .welcome-ornament-line {
      width: 120px; height: 1px; margin: 0 auto 28px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.4;
    }

    .welcome-ring {
      width: 96px; height: 96px; border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px; position: relative;
      animation: ringPulse 3s ease-in-out infinite;
    }
    .welcome-ring::before {
      content: ''; position: absolute; inset: -10px; border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.12);
    }
    .welcome-ring::after {
      content: ''; position: absolute; inset: -20px; border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.05);
    }
    @keyframes ringPulse {
      0%,100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.03); opacity: 1; }
    }

    .welcome-heart {
      font-size: 28px; color: var(--gold);
      animation: heartBeat 1.8s ease-in-out infinite;
    }
    @keyframes heartBeat {
      0%,100% { transform: scale(1); }
      12% { transform: scale(1.2); }
      24% { transform: scale(1); }
      36% { transform: scale(1.14); }
      48% { transform: scale(1); }
    }

    .welcome-names {
      font-family: var(--serif);
      font-size: clamp(24px, 6vw, 38px); color: rgba(255,255,255,0.92);
      letter-spacing: 10px; font-weight: 300; margin-bottom: 6px;
    }
    .welcome-amp {
      display: inline-block; color: var(--gold); font-size: 20px; margin: 0 8px;
      font-style: italic; font-weight: 300; opacity: 0.7;
      transform: translateY(-2px);
    }

    .welcome-sub {
      font-size: 10px; color: rgba(201,169,110,0.5); letter-spacing: 8px;
      font-weight: 300; margin-bottom: 48px; text-transform: uppercase;
    }

    .welcome-btn {
      position: relative; padding: 15px 52px;
      background: transparent; border: 1px solid rgba(201,169,110,0.35);
      color: var(--gold); font-size: 12px; letter-spacing: 5px;
      cursor: pointer; border-radius: 40px; transition: all 0.5s ease;
      font-family: var(--sans); font-weight: 300;
      backdrop-filter: blur(4px);
    }
    .welcome-btn:hover {
      background: rgba(201,169,110,0.1); border-color: var(--gold);
      box-shadow: 0 0 40px rgba(201,169,110,0.15), inset 0 0 20px rgba(201,169,110,0.05);
      transform: translateY(-2px);
    }
    .welcome-btn::before {
      content: ''; position: absolute; inset: -1px; border-radius: 40px;
      background: linear-gradient(135deg, rgba(201,169,110,0.15), transparent 50%, rgba(201,169,110,0.15));
      z-index: -1; opacity: 0; transition: opacity 0.5s;
    }
    .welcome-btn:hover::before { opacity: 1; }

    .welcome-ornament-line2 {
      width: 80px; height: 1px; margin: 36px auto 0;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,0.3), transparent);
    }

    .welcome-hint {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: rgba(201,169,110,0.25); letter-spacing: 4px;
      animation: hintFade 4s ease-in-out infinite; z-index: 2;
    }
    @keyframes hintFade {
      0%,100% { opacity: 0.2; }
      50% { opacity: 0.45; }
    }

    /* ========== Main Content ========== */
    .main-content {
      opacity: 0; transition: opacity 0.8s ease 0.5s;
    }
    .main-content.show { opacity: 1; }

    /* ========== Vinyl ========== */
    .vinyl {
      position: fixed; bottom: 28px; right: 28px; z-index: 9999;
      width: 54px; height: 54px; cursor: pointer; -webkit-tap-highlight-color: transparent;
      background: rgba(20,18,14,0.85); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 0 1px rgba(201,169,110,0.2);
      opacity: 0; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
      backdrop-filter: blur(12px);
    }
    .vinyl.show { opacity: 1; transform: scale(1); }

    .vinyl-disc {
      width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #2A2520, #0A0908);
      position: relative;
      animation: spin 2.8s linear infinite; animation-play-state: paused;
    }
    .vinyl.playing .vinyl-disc { animation-play-state: running; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .vinyl-disc::before {
      content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 1.5px, rgba(255,255,255,0.03) 1.5px 2.5px);
    }

    .vinyl-label {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--gold-dark);
      box-shadow: 0 0 6px rgba(201,169,110,0.3);
    }
    .vinyl-label::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 4px; height: 4px; border-radius: 50%; background: #0A0908;
    }

    .vinyl-icon {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center; z-index: 2; pointer-events: none;
    }
    .vinyl-icon svg { width: 14px; height: 14px; fill: var(--gold-light); filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6)); }
    .vinyl.playing .vinyl-icon { display: none; }

    .vinyl-note { position: absolute; font-size: 10px; opacity: 0; pointer-events: none; color: var(--gold); }
    .vinyl.playing .vinyl-note { animation: noteUp 2.5s ease-out infinite; }
    .vinyl-note:nth-child(1) { top: -6px; right: 2px; }
    .vinyl-note:nth-child(2) { top: -2px; right: -6px; animation-delay: 0.8s; }
    .vinyl-note:nth-child(3) { top: -8px; right: 8px; animation-delay: 1.6s; }
    @keyframes noteUp {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      15% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-24px) translateX(8px) scale(1); }
    }

    /* ========== Hero ========== */
    .hero {
      text-align: center; padding: 0 20px; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    .hero-bg-decor {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
    }
    .hero-bg-decor::before {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(201,169,110,0.04) 0%, transparent 70%);
    }
    .hero-bg-decor::after {
      content: ''; position: absolute; top: 10%; right: -5%;
      width: 300px; height: 300px; border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.06);
    }

    .hero-ornament {
      position: absolute; opacity: 0.08;
    }
    .hero-ornament svg { stroke: var(--gold); fill: none; stroke-width: 0.5; }

    .hero-photo {
      width: 108px; height: 108px; border-radius: 50%; overflow: hidden;
      margin-bottom: 32px; position: relative; z-index: 1;
      box-shadow: 0 0 0 1px rgba(201,169,110,0.2), 0 8px 40px rgba(0,0,0,0.08);
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }
    .hero-photo:hover {
      transform: scale(1.05);
      box-shadow: 0 0 0 1px rgba(201,169,110,0.3), 0 12px 48px rgba(0,0,0,0.12);
    }
    .hero-photo img { width: 100%; height: 100%; object-fit: cover; }
    .hero-photo-placeholder {
      width: 100%; height: 100%; background: linear-gradient(135deg, var(--cream), #EDE5D8);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(26px, 7vw, 40px); font-weight: 300; letter-spacing: 6px;
      margin-bottom: 8px; color: var(--text); position: relative; z-index: 1;
    }
    .hero-title .amp {
      color: var(--gold); font-style: italic; font-weight: 300;
      display: inline-block; margin: 0 4px; transform: translateY(-1px);
    }

    .hero-subtitle {
      font-size: 10px; color: var(--gold); letter-spacing: 6px;
      font-weight: 300; margin-bottom: 36px; text-transform: uppercase;
      position: relative; z-index: 1; opacity: 0.6;
    }

    .hero-ornament-line {
      width: 60px; height: 1px; margin: 0 auto 20px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.3; position: relative; z-index: 1;
    }

    .hero .date-range {
      display: inline-flex; align-items: center; gap: 16px;
      font-size: 12px; color: var(--gold); letter-spacing: 3px; font-weight: 300;
      position: relative; z-index: 1;
    }
    .date-range .line { width: 32px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }

    .scroll-hint {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      color: var(--gold); animation: bounce 2.5s ease-in-out infinite;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      opacity: 0.4; z-index: 1;
    }
    .scroll-hint span { font-size: 9px; letter-spacing: 4px; font-weight: 300; }
    .scroll-hint svg { width: 14px; height: 14px; stroke: var(--gold); fill: none; stroke-width: 1.5; }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(6px); }
    }

    /* ========== Timer ========== */
    .timer { text-align: center; padding: 20px 20px 48px; }

    .timer-label {
      font-size: 11px; color: var(--gold); letter-spacing: 5px; font-weight: 300; margin-bottom: 24px;
      opacity: 0.7;
    }

    .timer-display { display: flex; justify-content: center; align-items: flex-start; gap: 8px; }

    .timer-unit { display: flex; flex-direction: column; align-items: center; }

    .timer-num {
      font-family: var(--serif);
      font-size: clamp(44px, 12vw, 60px); font-weight: 300; color: var(--text);
      letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums;
    }

    .timer-tag {
      font-size: 10px; color: var(--gold); letter-spacing: 2px; margin-top: 8px; font-weight: 300;
      opacity: 0.6;
    }

    .timer-sep {
      font-family: var(--serif);
      font-size: clamp(34px, 10vw, 48px); font-weight: 300; color: #E0D8D0; line-height: 1;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.1; } }

    .timer-date {
      margin-top: 16px; font-size: 11px; color: var(--text-secondary);
      letter-spacing: 2px; font-weight: 300; opacity: 0.6;
    }

    /* ========== Stats ========== */
    .stats {
      display: flex; justify-content: center; gap: 0; padding: 0 20px 52px;
      max-width: 500px; margin: 0 auto;
    }
    .stat-item { text-align: center; flex: 1; padding: 0 16px; }
    .stat-num {
      font-family: var(--serif);
      font-size: 30px; font-weight: 300; color: var(--gold);
      line-height: 1.2;
    }
    .stat-label {
      font-size: 9px; color: var(--gold); letter-spacing: 3px;
      font-weight: 300; margin-top: 6px; opacity: 0.5;
    }
    .stat-divider { width: 1px; background: linear-gradient(180deg, transparent, var(--gold-light), transparent); align-self: stretch; opacity: 0.3; }

    /* ========== Quote ========== */
    .quote-section {
      text-align: center; padding: 8px 32px 52px; max-width: 480px; margin: 0 auto;
    }
    .quote-ornament {
      font-size: 20px; color: var(--gold); opacity: 0.2; margin-bottom: 16px;
      font-family: var(--serif);
    }
    .quote-text {
      font-family: var(--serif);
      font-size: 15px; color: var(--text-secondary); line-height: 2.4; font-weight: 300;
      font-style: italic;
    }

    /* ========== Section Divider ========== */
    .section-divider {
      text-align: center; padding: 20px 0 44px;
    }
    .section-divider-ornament {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin-bottom: 8px;
    }
    .section-divider-line { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }
    .section-divider-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0.4; }
    .section-divider-text {
      font-size: 10px; color: var(--gold); letter-spacing: 5px; font-weight: 300; opacity: 0.5;
    }

    /* ========== Month Label ========== */
    .month-label {
      text-align: center; padding: 48px 0 28px; position: relative; z-index: 2;
    }
    .month-label:first-child { padding-top: 0; }
    .month-label-inner {
      display: inline-flex; align-items: center; gap: 14px;
      padding: 8px 24px; background: var(--bg); border-radius: 24px;
      border: 1px solid rgba(201,169,110,0.12);
      box-shadow: 0 2px 12px rgba(0,0,0,0.02);
    }
    .month-label-text {
      font-family: var(--serif);
      font-size: 12px; color: var(--gold); letter-spacing: 3px; font-weight: 400;
    }
    .month-label-dot {
      width: 3px; height: 3px; border-radius: 50%; background: var(--gold); opacity: 0.4;
    }

    /* ========== Vine Timeline ========== */
    .vine-section {
      position: relative;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 0 80px;
    }

    .vine-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; pointer-events: none; z-index: 0;
      overflow: visible;
    }

    .vine-path {
      fill: none; stroke: var(--vine); stroke-width: 1.5; stroke-linecap: round;
      opacity: 0.6;
    }

    .vine-leaf {
      position: absolute; width: 10px; height: 10px; z-index: 1;
      opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease;
      transform: scale(0) rotate(-30deg);
    }
    .vine-leaf.visible { opacity: 0.35; transform: scale(1) rotate(0deg); }

    /* ========== Memory Card ========== */
    .mem {
      position: relative; z-index: 2; padding: 0 24px 52px;
      display: flex; align-items: flex-start;
    }
    .mem.left { justify-content: flex-start; padding-right: 52%; }
    .mem.right { justify-content: flex-end; padding-left: 52%; }

    .mem-card {
      background: var(--bg-card); border-radius: var(--radius); padding: 24px;
      border: 1px solid rgba(201,169,110,0.08); width: 100%; opacity: 0;
      transition: opacity 0.7s ease, transform 0.7s ease, box-shadow 0.4s ease;
      position: relative;
      box-shadow: 0 2px 16px rgba(0,0,0,0.03);
    }
    .mem.left .mem-card { transform: translateX(-30px) scale(0.96); }
    .mem.right .mem-card { transform: translateX(30px) scale(0.96); }
    .mem-card.visible { opacity: 1; transform: translateX(0) scale(1); }
    .mem-card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 0 0 1px rgba(201,169,110,0.08);
    }

    .mem-dot {
      position: absolute; top: 16px; width: 8px; height: 8px;
      background: var(--gold); border-radius: 50%; z-index: 3;
      opacity: 0; transition: opacity 0.5s ease 0.2s;
      box-shadow: 0 0 0 3px rgba(201,169,110,0.12), 0 0 8px rgba(201,169,110,0.15);
    }
    .mem-card.visible ~ .mem-dot, .mem-dot.visible { opacity: 1; }
    .mem.left .mem-dot { right: -30px; }
    .mem.right .mem-dot { left: -30px; }

    .mem-stem {
      position: absolute; top: 19px; height: 1px; background: var(--vine);
      z-index: 1; opacity: 0; transition: opacity 0.5s ease 0.3s, width 0.5s ease 0.3s; width: 0;
    }
    .mem-card.visible ~ .mem-stem, .mem-stem.visible { opacity: 0.4; width: 22px; }
    .mem.left .mem-stem { right: -22px; }
    .mem.right .mem-stem { left: -22px; }

    .mem-date {
      font-size: 10px; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px;
      font-weight: 400; opacity: 0.7;
    }

    .mem-title {
      font-family: var(--serif);
      font-size: 17px; font-weight: 400; margin-bottom: 8px; color: var(--text); line-height: 1.5;
    }

    .mem-text {
      font-size: 13px; color: var(--text-secondary); line-height: 2; font-weight: 300;
    }

    .mem-img {
      margin-top: 16px; border-radius: 12px; overflow: hidden;
      background: linear-gradient(135deg, var(--cream), #EDE5D8);
      aspect-ratio: 16/10;
      display: flex; align-items: center; justify-content: center;
    }
    .mem-img img { width: 100%; height: 100%; object-fit: cover; }
    .mem-img-ph { color: var(--gold); font-size: 20px; opacity: 0.3; }

    .mem-gallery { margin-top: 16px; display: grid; gap: 6px; }
    .mem-gallery.g2 { grid-template-columns: 1fr 1fr; }
    .mem-gallery.g3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .mem-gallery.g3 > :first-child { grid-row: 1 / 3; }
    .mem-gallery-item {
      border-radius: 10px; overflow: hidden; background: linear-gradient(135deg, var(--cream), #EDE5D8);
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    }
    .mem-gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .mem-card.highlight {
      background: linear-gradient(135deg, #FFFDF8 0%, #FEFBF4 100%);
      border-color: rgba(201,169,110,0.15);
    }
    .mem-card.highlight::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--gold-bg); border-radius: var(--radius) var(--radius) 0 0; opacity: 0.5;
    }

    .mem-tag {
      display: inline-block; font-size: 9px; color: var(--gold-dark);
      background: rgba(201,169,110,0.08); padding: 3px 10px; border-radius: 12px;
      letter-spacing: 1px; margin-top: 10px; font-weight: 400;
      border: 1px solid rgba(201,169,110,0.08);
    }

    /* ========== Footer ========== */
    .footer {
      text-align: center; padding: 56px 20px 80px; position: relative;
    }
    .footer-ornament {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 20px;
    }
    .footer-ornament-line { width: 30px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }
    .footer-ornament-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gold); opacity: 0.3; }

    /* ========== Progress Bar ========== */
    .progress-bar {
      position: fixed; top: 0; left: 0; height: 2px; z-index: 9998;

    /* ========== Back to Top ========== */
    .back-top {
      position: fixed; bottom: 28px; left: 28px; z-index: 9998;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.92); border: 1px solid rgba(201,169,110,0.15);
      display: flex; align-items: center; justify-content: center;

    }
    .back-top svg { width: 14px; height: 14px; stroke: var(--gold); fill: none; stroke-width: 2; }

    /* ========== Mobile ========== */
    @media (max-width: 640px) {
      .hero { min-height: 100svh; padding: 0 16px; }
      .mem { padding: 0 16px 40px 48px !important; justify-content: flex-start !important; }

    }

    @media (prefers-reduced-motion: reduce) {
      .mem-card { opacity: 1; transform: none; transition: none; }
      .scroll-hint { animation: none; }
      .vinyl-disc { animation: none; }
      .vine-leaf { transition: none; opacity: 0.35; transform: none; }
      .welcome-heart, .footer-heart { animation: none; }
    }

  <script>
    var START_DATE = new Date('2025-10-21');

    // ======== Welcome particles ========
    (function () {
      var box = document.getElementById('welcomeParticles');
      for (var i = 0; i < 35; i++) {
        var p = document.createElement('div');
        p.className = 'welcome-particle';
        var size = Math.random() * 3 + 1;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = (50 + Math.random() * 50) + '%';
        p.style.animationDelay = Math.random() * 10 + 's';
        p.style.animationDuration = (Math.random() * 6 + 6) + 's';
        p.style.background = Math.random() > 0.4 ? '#C9A96E' : 'rgba(255,255,255,0.25)';
        box.appendChild(p);
      }
    })();

    // ======== Welcome -> Main: music guaranteed on user gesture ========
    (function () {
      var welcome = document.getElementById('welcome');
      var mainContent = document.getElementById('mainContent');
      var vinyl = document.getElementById('vinylPlayer');
      var audio = document.getElementById('bgMusic');
      var started = false;

      function enterSite() {
        if (started) return;
        started = true;

        // This IS a user gesture (click), so play() is guaranteed
        audio.load();
        var playPromise = audio.play();
        if (playPromise) {
          playPromise.then(function () {
            vinyl.classList.add('playing');
          }).catch(function () {
            // If still blocked, retry on next user interaction
            document.addEventListener('click', function retryPlay() {
              audio.play().then(function () {
                vinyl.classList.add('playing');
              }).catch(function () {});
              document.removeEventListener('click', retryPlay);
            }, { once: true });
          });
        }

        welcome.classList.add('hide');
        setTimeout(function () {
          mainContent.classList.add('show');
          vinyl.classList.add('show');
        }, 500);
        setTimeout(function () { welcome.style.display = 'none'; }, 1300);
      }

      welcome.addEventListener('click', enterSite);
    })();

    // ======== Timer + Stats ========
    (function () {
      var TOGETHER = new Date('2026-03-07');
      function tick() {
        var now = new Date();
        var d = Math.floor((now - START_DATE) / 1000);
        var s = d % 60; d = Math.floor(d / 60);
        var m = d % 60; d = Math.floor(d / 60);
        var h = d % 24; d = Math.floor(d / 24);
        document.getElementById('tDay').textContent = d;
        document.getElementById('tHour').textContent = h;
        document.getElementById('tMin').textContent = m;
        document.getElementById('tSec').textContent = s;
        document.getElementById('statDays').textContent = Math.floor((now - START_DATE) / 86400000);
        document.getElementById('statTogether').textContent = Math.max(0, Math.floor((now - TOGETHER) / 86400000));
      }
      tick(); setInterval(tick, 1000);
    })();

    // ======== Vine + Memories ========
    (function () {
      var section = document.getElementById('vineSection');
      var svg = document.getElementById('vineSvg');
      var path = document.getElementById('vinePath');
      var leavesBox = document.getElementById('vineLeaves');
      var container = document.getElementById('memories');
      var isMobile = window.innerWidth <= 640;

      var DATA = {
        "hero":{"img":"","startDate":"2025.10.21","quote":"2025.10.21 认识，2026.03.07 在一起<br>以后的每一天，都是我们的故事","names":"刘宣富 & 穆奕彤"},
        "memories":[
          {"date":"2025 / 10 / 21","title":"初次相遇","text":"茫茫人海中，我们的目光第一次交汇。那一天，命运悄悄写下了一个开始。","img":"","highlight":true,"tag":"起点"},
          {"date":"2025 / 10","title":"第一次聊天","text":"从陌生到熟悉，每一句话都让彼此的心更近一点。","img":"","gallery":["",""]},
          {"date":"2025 / 11","title":"慢慢了解","text":"开始分享日常，早安晚安成了习惯，手机里多了一个特别的置顶。","img":""},
          {"date":"2025 / 11","title":"第一次见面","text":"终于从屏幕走到现实，看到真实的你，比想象中更让人心动。","img":"","highlight":true,"tag":"里程碑"},
          {"date":"2025 / 12","title":"冬天的温暖","text":"天冷了，但有你在的每一天都是暖的。一起走过的街道，连风都变得温柔。","img":"","gallery":["","",""]},
          {"date":"2025 / 12 / 25","title":"第一个圣诞节","text":"今年的圣诞树下，多了一个想一起许愿的人。","img":"","tag":"节日"},
          {"date":"2025 / 12 / 31","title":"跨年夜","text":"倒计时的最后一秒，身边是你，这就是最好的跨年方式。","img":"","highlight":true,"tag":"节日"},
          {"date":"2026 / 01","title":"新年第一天","text":"新的一年，第一个想见的人是你，第一个想说的话也是给你。","img":""},
          {"date":"2026 / 01","title":"一起的小事","text":"一起吃饭、一起散步、一起发呆......平凡的日子里，因为有你变得闪闪发光。","img":"","gallery":["",""]},
          {"date":"2026 / 02","title":"情人节","text":"2.14，第一个属于我们的情人节。你是我收到过最好的礼物。","img":"","highlight":true,"tag":"节日"},
          {"date":"2026 / 02","title":"元宵节","text":"一起看花灯，一起吃汤圆，甜甜蜜蜜就是我们的样子。","img":""},
          {"date":"2026 / 03 / 07","title":"在一起了","text":"这一天，你说了那句话，我的世界从此有了色彩。从朋友到恋人，我们终于走到了一起。","img":"","highlight":true,"tag":"在一起"},
          {"date":"2026 / 03","title":"恋爱的第一天","text":"牵着你的手走在路上，原来这就是全世界最幸福的事。","img":"","gallery":["",""]},
          {"date":"2026 / 03","title":"一起的日常","text":"早安变成了想你，晚安变成了舍不得挂电话。每一天都在创造只属于我们的回忆。","img":""},
          {"date":"2026 / 04","title":"春天来了","text":"万物复苏的季节，我们的爱情也在悄悄生长。四月的风，都是甜的。","img":"","tag":"季节"},
          {"date":"2026 / 04","title":"一起旅行","text":"第一次一起出远门，陌生的城市因为有你变成了最温暖的地方。","img":"","highlight":true,"gallery":["","",""]},
          {"date":"2026 / 05","title":"五月天","text":"初夏的傍晚，和你一起看夕阳，时间好像在那一刻停住了。","img":""},
          {"date":"2026 / 05 / 20","title":"520","text":"520，说一万遍爱你都不够。你是我的例外，也是我的偏爱。","img":"","highlight":true,"tag":"节日"},
          {"date":"2026 / 06","title":"夏天来了","text":"冰淇淋、西瓜、晚风、和你。这就是夏天最美好的样子。","img":"","gallery":["",""]},
          {"date":"2026 / 06","title":"一起看日落","text":"那天的晚霞特别美，但你看我的眼神更美。","img":""},
          {"date":"2026 / 07","title":"盛夏光年","text":"七月的阳光很烈，但有你在身边，连汗水都是甜的。我们的故事，还在继续......","img":"","highlight":true,"tag":"现在"},
          {"date":"2026 / 07","title":"未来的日子","text":"还有很多很多天，要和你一起走过。每一天，都是我爱你的证据。","img":""}
        ]
      };

      document.getElementById('statMemories').textContent = DATA.memories.length;

      function loadMemories(data) {
        container.innerHTML = '';
        var lastMonth = '';
        data.forEach(function (item, i) {
          var side = i % 2 === 0 ? 'left' : 'right';
          var hl = item.highlight ? ' highlight' : '';
          var parts = item.date.split('/');
          var month = parts[0].trim() + '/' + parts[1].trim();
          if (month !== lastMonth) {
            lastMonth = month;
            var mn = {'2025/10':'2025 年 10 月','2025/11':'2025 年 11 月','2025/12':'2025 年 12 月',
              '2026/01':'2026 年 1 月','2026/02':'2026 年 2 月','2026/03':'2026 年 3 月',
              '2026/04':'2026 年 4 月','2026/05':'2026 年 5 月','2026/06':'2026 年 6 月','2026/07':'2026 年 7 月'};
            container.insertAdjacentHTML('beforeend',
              '<div class="month-label"><div class="month-label-inner"><div class="month-label-dot"></div><div class="month-label-text">'+(mn[month]||month)+'</div><div class="month-label-dot"></div></div></div>');
          }

          var mediaHtml = '';
          if (item.gallery && item.gallery.length > 0) {
            var gc = item.gallery.length >= 3 ? 'g3' : 'g2';
            mediaHtml = '<div class="mem-gallery '+gc+'">';
            item.gallery.forEach(function (g) {
              mediaHtml += '<div class="mem-gallery-item">' + (g ? '<img src="'+g+'" loading="lazy">' : '<div class="mem-img-ph">&#128247;</div>') + '</div>';
            });
            mediaHtml += '</div>';
          } else if (item.img) {
            mediaHtml = '<div class="mem-img"><img src="'+item.img+'" alt="'+item.title+'" loading="lazy"></div>';
          } else {
            mediaHtml = '<div class="mem-img"><div class="mem-img-ph">&#128247;</div></div>';
          }

          var tagHtml = item.tag ? '<div class="mem-tag">'+item.tag+'</div>' : '';

          container.insertAdjacentHTML('beforeend',
            '<div class="mem '+side+'" data-vine>'
            + '<div class="mem-card'+hl+'">'
            + '<div class="mem-date">'+item.date+'</div>'
            + '<div class="mem-title">'+item.title+'</div>'
            + '<div class="mem-text">'+item.text+'</div>'
            + mediaHtml + tagHtml
            + '</div><div class="mem-dot"></div><div class="mem-stem"></div></div>');
        });
      }

      // Init
      (function () {
        var h = DATA.hero;
        if (h.img) {
          document.getElementById('heroPlaceholder').style.display = 'none';
          var img = document.createElement('img');
          img.src = h.img; img.alt = '我们';
          document.getElementById('heroPhoto').appendChild(img);
        }
        if (h.startDate) document.getElementById('heroStartDate').textContent = h.startDate;
        if (h.quote) document.getElementById('quoteText').innerHTML = h.quote;
        if (h.startDate) START_DATE = new Date(h.startDate);

        loadMemories(DATA.memories);

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            buildVine();
          });
        });
      })();

      var totalLen = 0;

      function buildVine() {
        var memEls = document.querySelectorAll('.mem');
        var w = section.offsetWidth;
        var h = section.offsetHeight;
        var cx = isMobile ? 28 : w / 2;
        var count = memEls.length;

        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        svg.style.width = w + 'px';
        svg.style.height = h + 'px';

        var points = [];
        memEls.forEach(function (el, i) {
          var card = el.querySelector('.mem-card');
          var rect = card.getBoundingClientRect();
          var sectionRect = section.getBoundingClientRect();
          var cy = rect.top - sectionRect.top + 20;
          var cx2 = isMobile ? 28 : (el.classList.contains('left') ? rect.right - sectionRect.left + 12 : rect.left - sectionRect.left - 12);
          points.push({ x: cx2, y: cy });
        });

        if (points.length > 0) {
          points.unshift({ x: points[0].x, y: 0 });
          points.push({ x: points[points.length-1].x, y: h });
        }

        var d = 'M ' + points[0].x.toFixed(1) + ' ' + points[0].y.toFixed(1);
        for (var j = 0; j < points.length - 1; j++) {
          var p0 = points[Math.max(0, j - 1)];
          var p1 = points[j];
          var p2 = points[j + 1];
          var p3 = points[Math.min(points.length - 1, j + 2)];
          var tension = 5;
          var cp1x = p1.x + (p2.x - p0.x) / tension;
          var cp1y = p1.y + (p2.y - p0.y) / tension;
          var cp2x = p2.x - (p3.x - p1.x) / tension;
          var cp2y = p2.y - (p3.y - p1.y) / tension;
          d += ' C ' + cp1x.toFixed(1) + ' ' + cp1y.toFixed(1)
            + ', ' + cp2x.toFixed(1) + ' ' + cp2y.toFixed(1)
            + ', ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
        }

        path.setAttribute('d', d);
        totalLen = path.getTotalLength();
        path.style.strokeDasharray = totalLen;
        path.style.strokeDashoffset = totalLen;

        // Leaves
        leavesBox.innerHTML = '';
        memEls.forEach(function (el, i) {
          if (i >= points.length - 2) return;
          var pt = points[i + 1];
          var side = i % 2 === 0 ? 1 : -1;
          var lx = pt.x + side * (isMobile ? 10 : 20);
          var ly = pt.y;
          var leaf = document.createElement('div');
          leaf.className = 'vine-leaf';
          leaf.style.left = lx + 'px';
          leaf.style.top = ly + 'px';
          leaf.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#9AB07A" stroke-width="1.5"><path d="M12 2C6 8 2 14 12 22C22 14 18 8 12 2Z"/><line x1="12" y1="8" x2="12" y2="22"/></svg>';
          leavesBox.appendChild(leaf);
        });

        // Scroll
        var memCards = document.querySelectorAll('.mem-card');
        var memDots = document.querySelectorAll('.mem-dot');
        var memStems = document.querySelectorAll('.mem-stem');
        var leafEls = document.querySelectorAll('.vine-leaf');

        function onScroll() {
          var rect = section.getBoundingClientRect();
          var viewH = window.innerHeight;
          var scrolled = Math.max(0, -rect.top + viewH * 0.6);
          var total = rect.height;
          var progress = Math.min(scrolled / total, 1);
          path.style.strokeDashoffset = totalLen * (1 - progress);

          memEls.forEach(function (item, i) {
            var r = item.getBoundingClientRect();
            if (r.top < viewH * 0.82) {
              if (memCards[i]) memCards[i].classList.add('visible');
              if (memDots[i]) memDots[i].classList.add('visible');
              if (memStems[i]) memStems[i].classList.add('visible');
              if (leafEls[i]) leafEls[i].classList.add('visible');
            }
          });
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      }

      window.addEventListener('resize', function () {
        isMobile = window.innerWidth <= 640;
        if (document.querySelectorAll('.mem').length > 0) buildVine();
      });
    })();

    // ======== Progress bar ========
    (function () {
      var bar = document.getElementById('progressBar');
      window.addEventListener('scroll', function () {
        var h = document.documentElement;
        bar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
      }, { passive: true });
    })();

    // ======== Back to top ========
    (function () {
      var btn = document.getElementById('backTop');
      window.addEventListener('scroll', function () {
        btn.classList.toggle('show', window.scrollY > 400);
      }, { passive: true });
      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();

    // ======== Music controls ========
    (function () {
      var audio = document.getElementById('bgMusic');
      var vinyl = document.getElementById('vinylPlayer');
      var playing = false;

      function start() {
        audio.load();
        audio.play().then(function () {
          playing = true;
          vinyl.classList.add('playing');
        }).catch(function () {});
      }
      function stop() {
        audio.pause(); playing = false;
        vinyl.classList.remove('playing');
      }

      vinyl.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (playing) stop(); else start();
      });
    })();
  </script>
</body>
</html>
