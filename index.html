<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>刘宣富 & 穆奕彤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF9F5;
      --bg-warm: #FFF5EE;
      --bg-card: #FFFFFF;
      --text: #3D2E2E;
      --text-soft: #8B7070;
      --pink: #E8889A;
      --pink-light: #F4C2CE;
      --pink-bg: #FFF0F3;
      --peach: #F5C6A0;
      --peach-light: #FDDEC8;
      --rose: #D4738B;
      --cream: #FFF8F2;
      --vine: #D4A89A;
      --leaf: #B8C9A3;
      --radius: 14px;
      --serif: 'Noto Serif SC', 'STSong', serif;
      --sans: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img { max-width: 100%; display: block; }

    /* ========== Welcome ========== */
    .welcome {
      position: fixed; inset: 0; z-index: 10000;
      background: #FFFAF7;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
      cursor: pointer; overflow: hidden;
    }
    .welcome.hide { opacity: 0; transform: scale(1.03); pointer-events: none; }

    /* Photo vortex */
    .welcome-vortex {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; pointer-events: none;
      perspective: 900px;
    }

    .vortex-stage {
      position: relative;
      width: 300px; height: 300px;
      transform-style: preserve-3d;
    }

    .vortex-ring {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
    }

    .vortex-ring.spin1 { animation: ringRotate 18s linear infinite; }
    .vortex-ring.spin2 { animation: ringRotate 25s linear infinite reverse; }
    .vortex-ring.spin3 { animation: ringRotate 32s linear infinite; }

    @keyframes ringRotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    .vortex-card {
      position: absolute;
      top: 50%; left: 50%;
      width: 100px; height: 70px;
      margin: -35px 0 0 -50px;
      border-radius: 8px; overflow: hidden;
      background: rgba(240,232,228,0.8);
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      backface-visibility: hidden;
    }
    .vortex-card img { width: 100%; height: 100%; object-fit: cover; }
    .vortex-card-ph {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #D4C0B8;
    }

    /* Center glow */
    .vortex-glow {
      position: absolute;
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(212,115,139,0.08) 0%, transparent 70%);
      pointer-events: none; z-index: 1;
    }

    .welcome-content { position: relative; z-index: 3; text-align: center; }

    .welcome-heart {
      font-size: 24px; color: #D4738B; margin-bottom: 24px;
      animation: heartBeat 1.5s ease-in-out infinite;
    }
    @keyframes heartBeat {
      0%,100% { transform: scale(1); }
      12% { transform: scale(1.18); }
      24% { transform: scale(1); }
      36% { transform: scale(1.12); }
      48% { transform: scale(1); }
    }

    .welcome-names-wrap {
      min-height: 44px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center;
    }
    .welcome-names {
      font-family: var(--serif);
      font-size: clamp(20px, 5vw, 30px); color: #3D2E2E;
      letter-spacing: 6px; font-weight: 500;
    }
    .welcome-amp {
      color: #D4738B; font-size: 16px; margin: 0 6px;
      font-style: italic; font-weight: 400;
    }
    .welcome-cursor {
      display: inline-block; width: 1.5px; height: 0.9em; background: #D4738B;
      margin-left: 2px; vertical-align: middle; opacity: 0.6;
      animation: cursorBlink 0.8s step-end infinite;
    }
    @keyframes cursorBlink { 0%,100% { opacity: 0.6; } 50% { opacity: 0; } }

    .welcome-sub {
      font-size: 11px; color: #B8A0A0; letter-spacing: 5px;
      font-weight: 400; margin-bottom: 40px; text-transform: uppercase;
    }

    .welcome-btn {
      padding: 11px 36px; background: transparent;
      border: 1px solid #E8D5D5;
      color: #B88090; font-size: 12px; letter-spacing: 3px;
      cursor: pointer; border-radius: 32px; transition: all 0.3s ease;
      font-family: var(--sans); font-weight: 400; opacity: 0;
    }
    .welcome-btn.show { opacity: 1; transition: opacity 0.5s ease; }
    .welcome-btn:hover {
      background: #FFF5F5; border-color: #D4A8B8;
    }

    .welcome-hint {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: #C8B0B0; letter-spacing: 2px;
    }

    /* ========== Main ========== */
    .main-content { opacity: 0; transition: opacity 0.7s ease 0.4s; }
    .main-content.show { opacity: 1; }

    /* ========== Vinyl ========== */
    .vinyl {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      width: 48px; height: 48px; cursor: pointer;
      background: #F5EEEA; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      opacity: 0; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .vinyl.show { opacity: 1; transform: scale(1); }
    .vinyl-disc {
      width: 100%; height: 100%; border-radius: 50%;
      background: #E8DDD8;
      position: relative;
      animation: spin 2.8s linear infinite; animation-play-state: paused;
    }
    .vinyl.playing .vinyl-disc { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .vinyl-disc::before {
      content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 1px, rgba(255,255,255,0.4) 1px 2px);
    }
    .vinyl-label {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 12px; height: 12px; border-radius: 50%; background: #D4738B;
    }
    .vinyl-label::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 3px; height: 3px; border-radius: 50%; background: #F5EEEA;
    }
    .vinyl-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 2; pointer-events: none;
    }
    .vinyl-icon svg { width: 12px; height: 12px; fill: #B88090; }
    .vinyl.playing .vinyl-icon { display: none; }
    .vinyl-note { position: absolute; font-size: 9px; opacity: 0; pointer-events: none; color: #D4738B; }
    .vinyl.playing .vinyl-note { animation: noteUp 2.5s ease-out infinite; }
    .vinyl-note:nth-child(1) { top: -5px; right: 2px; }
    .vinyl-note:nth-child(2) { top: -1px; right: -5px; animation-delay: 0.8s; }
    .vinyl-note:nth-child(3) { top: -7px; right: 6px; animation-delay: 1.6s; }
    @keyframes noteUp {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      15% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-20px) translateX(6px) scale(1); }
    }

    /* ========== Hero ========== */
    .hero {
      text-align: center; padding: 0 20px; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
    }
    .hero-glow {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(232,136,154,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-photo {
      width: 100px; height: 100px; border-radius: 50%; overflow: hidden;
      margin-bottom: 24px; position: relative; z-index: 1;
      box-shadow: 0 0 0 2px rgba(232,136,154,0.2), 0 8px 32px rgba(232,136,154,0.1);
      transition: transform 0.4s ease;
    }
    .hero-photo:hover { transform: scale(1.05); }
    .hero-photo img { width: 100%; height: 100%; object-fit: cover; }
    .hero-photo-placeholder {
      width: 100%; height: 100%; background: var(--pink-bg);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(22px, 6vw, 34px); font-weight: 500; letter-spacing: 4px;
      margin-bottom: 6px; color: var(--text); position: relative; z-index: 1;
    }
    .hero-title .amp { color: var(--pink); font-style: italic; margin: 0 4px; }

    .hero-subtitle {
      font-size: 11px; color: var(--pink); letter-spacing: 4px;
      font-weight: 400; margin-bottom: 28px; opacity: 0.6;
    }

    .hero .date-range {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--pink); letter-spacing: 2px; font-weight: 400;
      position: relative; z-index: 1;
    }
    .date-range .line { width: 24px; height: 1px; background: var(--pink-light); }

    .scroll-hint {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      color: var(--pink); animation: bounce 2.5s ease-in-out infinite;
      display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 0.35; z-index: 1;
    }
    .scroll-hint span { font-size: 9px; letter-spacing: 3px; font-weight: 400; }
    .scroll-hint svg { width: 14px; height: 14px; stroke: var(--pink); fill: none; stroke-width: 1.5; }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(5px); }
    }

    /* ========== Timer ========== */
    .timer { text-align: center; padding: 16px 20px 36px; }
    .timer-label {
      font-size: 11px; color: var(--pink); letter-spacing: 4px; font-weight: 400; margin-bottom: 18px; opacity: 0.6;
    }
    .timer-display { display: flex; justify-content: center; align-items: flex-start; gap: 6px; }
    .timer-unit { display: flex; flex-direction: column; align-items: center; }
    .timer-num {
      font-family: var(--serif);
      font-size: clamp(38px, 10vw, 52px); font-weight: 600; color: var(--text);
      letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums;
    }
    .timer-tag {
      font-size: 10px; color: var(--pink); letter-spacing: 2px; margin-top: 6px; font-weight: 400; opacity: 0.5;
    }
    .timer-sep {
      font-family: var(--serif);
      font-size: clamp(30px, 8vw, 42px); font-weight: 400; color: var(--pink-light); line-height: 1;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }
    .timer-date { margin-top: 12px; font-size: 11px; color: var(--text-soft); letter-spacing: 2px; font-weight: 400; opacity: 0.5; }

    /* ========== Stats ========== */
    .stats {
      display: flex; justify-content: center; gap: 0; padding: 0 20px 40px;
      max-width: 440px; margin: 0 auto;
    }
    .stat-item { text-align: center; flex: 1; padding: 0 12px; }
    .stat-num { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--pink); line-height: 1.2; }
    .stat-label { font-size: 9px; color: var(--pink); letter-spacing: 2px; font-weight: 400; margin-top: 4px; opacity: 0.45; }
    .stat-divider { width: 1px; background: var(--pink-light); align-self: stretch; opacity: 0.3; }

    /* ========== Quote ========== */
    .quote-section { text-align: center; padding: 4px 24px 40px; max-width: 440px; margin: 0 auto; }
    .quote-emoji { font-size: 18px; margin-bottom: 10px; }
    .quote-text {
      font-family: var(--serif);
      font-size: 14px; color: var(--text-soft); line-height: 2.2; font-weight: 400; font-style: italic;
    }

    /* ========== Divider ========== */
    .section-divider { text-align: center; padding: 12px 0 32px; }
    .section-divider-ornament { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
    .section-divider-line { width: 32px; height: 1px; background: var(--pink-light); }
    .section-divider-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--pink); opacity: 0.4; }
    .section-divider-text { font-size: 10px; color: var(--pink); letter-spacing: 4px; font-weight: 400; opacity: 0.45; }

    /* ========== Month ========== */
    .month-label { text-align: center; padding: 36px 0 18px; position: relative; z-index: 2; }
    .month-label:first-child { padding-top: 0; }
    .month-label-inner {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 5px 18px; background: var(--bg); border-radius: 18px;
      border: 1px solid rgba(232,136,154,0.12);
    }
    .month-label-text { font-family: var(--serif); font-size: 11px; color: var(--pink); letter-spacing: 2px; font-weight: 500; }
    .month-label-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--pink); opacity: 0.35; }

    /* ========== Timeline ========== */
    .vine-section { position: relative; max-width: 660px; margin: 0 auto; padding: 0 0 50px; }
    .vine-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible;
    }
    .vine-path { fill: none; stroke: var(--vine); stroke-width: 1.5; stroke-linecap: round; opacity: 0.4; }
    .vine-leaf {
      position: absolute; width: 10px; height: 10px; z-index: 1;
      opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease;
      transform: scale(0) rotate(-30deg);
    }
    .vine-leaf.visible { opacity: 0.3; transform: scale(1) rotate(0deg); }

    /* ========== Card ========== */
    .mem { position: relative; z-index: 2; padding: 0 18px 32px; display: flex; align-items: flex-start; }
    .mem.left { justify-content: flex-start; padding-right: 54%; }
    .mem.right { justify-content: flex-end; padding-left: 54%; }

    .mem-card {
      background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
      border: 1px solid rgba(232,136,154,0.08); width: 100%; opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease;
      position: relative; cursor: pointer;
      box-shadow: 0 2px 10px rgba(232,136,154,0.04);
    }
    .mem.left .mem-card { transform: translateX(-20px) scale(0.97); }
    .mem.right .mem-card { transform: translateX(20px) scale(0.97); }
    .mem-card.visible { opacity: 1; transform: translateX(0) scale(1); }
    .mem-card:hover { box-shadow: 0 6px 20px rgba(232,136,154,0.1); }
    .mem-card.highlight { border-color: rgba(232,136,154,0.15); }
    .mem-card.highlight::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--pink), var(--peach)); opacity: 0.5; z-index: 1;
    }

    .mem-card-img {
      width: 100%; aspect-ratio: 16/10; background: var(--pink-bg);
      display: flex; align-items: center; justify-content: center;
    }
    .mem-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .mem-card-img-ph { font-size: 22px; opacity: 0.2; color: var(--pink); }

    .mem-card-body { padding: 12px 14px 14px; }
    .mem-card-date { font-size: 10px; color: var(--pink); letter-spacing: 2px; font-weight: 400; opacity: 0.6; margin-bottom: 3px; }
    .mem-card-title { font-family: var(--serif); font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; }
    .mem-card-hint { font-size: 10px; color: var(--pink); letter-spacing: 1px; margin-top: 5px; opacity: 0.35; }

    .mem-tag {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      font-size: 9px; color: var(--rose); background: rgba(255,255,255,0.92);
      padding: 2px 8px; border-radius: 10px; letter-spacing: 1px; font-weight: 400;
      backdrop-filter: blur(4px); border: 1px solid rgba(232,136,154,0.1);
    }

    .mem-dot {
      position: absolute; top: 12px; width: 7px; height: 7px;
      background: var(--pink); border-radius: 50%; z-index: 3;
      opacity: 0; transition: opacity 0.4s ease 0.2s;
      box-shadow: 0 0 0 2px rgba(232,136,154,0.12);
    }
    .mem-card.visible ~ .mem-dot, .mem-dot.visible { opacity: 1; }
    .mem.left .mem-dot { right: -26px; }
    .mem.right .mem-dot { left: -26px; }

    .mem-stem {
      position: absolute; top: 15px; height: 1px; background: var(--vine);
      z-index: 1; opacity: 0; transition: opacity 0.4s ease 0.3s, width 0.4s ease 0.3s; width: 0;
    }
    .mem-card.visible ~ .mem-stem, .mem-stem.visible { opacity: 0.3; width: 18px; }
    .mem.left .mem-stem { right: -18px; }
    .mem.right .mem-stem { left: -18px; }

    /* ========== Modal ========== */
    .modal-mask {
      position: fixed; inset: 0; z-index: 10001;
      background: rgba(60,40,40,0.3); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      padding: 20px;
    }
    .modal-mask.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--bg-card); border-radius: 18px; max-width: 500px; width: 100%;
      max-height: 85vh; overflow-y: auto; position: relative;
      transform: translateY(16px) scale(0.97); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 16px 48px rgba(0,0,0,0.1);
    }
    .modal-mask.open .modal { transform: translateY(0) scale(1); }

    .modal-close {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.9); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--text-soft);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .modal-close:hover { background: #fff; }

    .modal-img {
      width: 100%; aspect-ratio: 16/10; background: var(--pink-bg);
      display: flex; align-items: center; justify-content: center; border-radius: 18px 18px 0 0;
      overflow: hidden;
    }
    .modal-img img { width: 100%; height: 100%; object-fit: cover; }
    .modal-img-ph { font-size: 28px; opacity: 0.12; color: var(--pink); }

    .modal-gallery { display: grid; gap: 4px; }
    .modal-gallery.g2 { grid-template-columns: 1fr 1fr; }
    .modal-gallery.g3 { grid-template-columns: 1fr 1fr; }
    .modal-gallery-item {
      aspect-ratio: 1; background: var(--pink-bg);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .modal-gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .modal-body { padding: 22px 24px 26px; }
    .modal-date { font-size: 11px; color: var(--pink); letter-spacing: 2px; font-weight: 400; opacity: 0.6; margin-bottom: 6px; }
    .modal-title { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 10px; }
    .modal-text { font-size: 14px; color: var(--text-soft); line-height: 2; font-weight: 400; }
    .modal-tag {
      display: inline-block; font-size: 10px; color: var(--rose);
      background: var(--pink-bg); padding: 3px 10px; border-radius: 10px;
      letter-spacing: 1px; margin-top: 12px; font-weight: 400;
    }

    /* ========== Footer ========== */
    .footer { text-align: center; padding: 44px 20px 64px; }
    .footer-line { width: 32px; height: 1px; background: var(--pink-light); margin: 0 auto 14px; }
    .footer p { color: var(--pink); font-size: 10px; letter-spacing: 3px; font-weight: 400; opacity: 0.45; }
    .footer .footer-names {
      font-family: var(--serif); font-size: 16px; color: var(--text); margin-top: 8px;
      letter-spacing: 4px; font-weight: 500;
    }
    .footer .footer-heart { display: inline-block; color: var(--pink); font-size: 11px; margin: 0 4px; animation: heartBeat 1.5s ease-in-out infinite; }
    .footer .footer-year { font-size: 10px; color: var(--pink); margin-top: 14px; letter-spacing: 2px; font-weight: 400; opacity: 0.3; }

    /* ========== Progress ========== */
    .progress-bar {
      position: fixed; top: 0; left: 0; height: 2px; z-index: 9998;
      background: linear-gradient(90deg, var(--pink), var(--peach)); width: 0; transition: width 0.1s linear;
    }

    /* ========== Back Top ========== */
    .back-top {
      position: fixed; bottom: 24px; left: 24px; z-index: 9998;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.9); border: 1px solid rgba(232,136,154,0.12);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transform: translateY(8px);
      transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .back-top.show { opacity: 1; transform: translateY(0); }
    .back-top:hover { background: #fff; box-shadow: 0 3px 12px rgba(232,136,154,0.1); }
    .back-top svg { width: 12px; height: 12px; stroke: var(--pink); fill: none; stroke-width: 2; }

    /* ========== Mobile ========== */
    @media (max-width: 640px) {
      .hero { min-height: 100svh; padding: 0 16px; }
      .mem { padding: 0 10px 28px 40px !important; justify-content: flex-start !important; }
      .mem-dot { left: -22px !important; right: auto !important; }
      .mem-stem { left: -16px !important; right: auto !important; width: 14px !important; }
      .mem-card { transform: translateX(14px) scale(0.97); }
      .mem-card.visible { transform: translateX(0) scale(1); }
      .vinyl { bottom: 16px; right: 16px; width: 42px; height: 42px; }

  <script>
    var START_DATE = new Date('2025-10-21');

      var stage = document.getElementById('vortexStage');
      if (!stage) return;

      // 3 rings, each with photos placed in a circle using 3D transforms
      var rings = [
        { cls: 'spin1', count: Math.min(photos.length, 6), radius: 180, y: 0, opacity: 0.5 },
        { cls: 'spin2', count: Math.min(photos.length, 5), radius: 260, y: 20, opacity: 0.3 },

        var el = document.createElement('div');
        el.className = 'vortex-ring ' + ring.cls;
        el.style.opacity = ring.opacity;

        var angleStep = 360 / ring.count;
        for (var i = 0; i < ring.count; i++) {
          var angle = angleStep * i;
          var photoIdx = (i + ri * 2) % photos.length;
          var card = document.createElement('div');
          card.className = 'vortex-card';
          // Position in 3D circle: rotateY then translateZ

          card.style.top = 'calc(50% + ' + ring.y + 'px)';

          if (photos[photoIdx]) {
            card.innerHTML = '<img src="' + photos[photoIdx] + '" loading="lazy">';
          } else {
            card.innerHTML = '<div class="vortex-card-ph">&#128247;</div>';
          }
          el.appendChild(card);

        stage.appendChild(el);
      });

        setTimeout(function () { welcome.style.display = 'none'; }, 1100);

    // Timer

        document.getElementById('statTogether').textContent = Math.max(0, Math.floor((now - TOGETHER) / 86400000));
      }

    })();

    // Data + Timeline + Modal

      var isMobile = window.innerWidth <= 640;

      var DATA = {
        "hero":{"img":"","startDate":"2025.10.21","quote":"2025.10.21 认识，2026.03.07 在一起<br>以后的每一天，都是我们的故事","names":"刘宣富 & 穆奕彤"},
        "memories":[
          {"date":"2025 / 10 / 21","title":"初次相遇","text":"茫茫人海中，我们的目光第一次交汇。那一天，命运悄悄写下了一个开始。","img":"","highlight":true,"tag":"起点"},

          {"date":"2026 / 01","title":"一起的小事","text":"一起吃饭、一起散步、一起发呆......平凡的日子里，因为有你变得闪闪发光。","img":"","gallery":["",""]},

          {"date":"2026 / 03","title":"恋爱的第一天","text":"牵着你的手走在路上，原来这就是全世界最幸福的事。","img":"","gallery":["",""]},
          {"date":"2026 / 03","title":"一起的日常","text":"早安变成了想你，晚安变成了舍不得挂电话。每一天都在创造只属于我们的回忆。","img":""},
          {"date":"2026 / 04","title":"春天来了","text":"万物复苏的季节，我们的爱情也在悄悄生长。四月的风，都是甜的。","img":"","tag":"季节"},
          {"date":"2026 / 04","title":"一起旅行","text":"第一次一起出远门，陌生的城市因为有你变成了最温暖的地方。","img":"","highlight":true,"gallery":["","",""]},
          {"date":"2026 / 05","title":"五月天","text":"初夏的傍晚，和你一起看夕阳，时间好像在那一刻停住了。","img":""},
          {"date":"2026 / 05 / 20","title":"520","text":"520，说一万遍爱你都不够。你是我的例外，也是我的偏爱。","img":"","highlight":true,"tag":"节日"},
          {"date":"2026 / 06","title":"夏天来了","text":"冰淇淋、西瓜、晚风、和你。这就是夏天最美好的样子。","img":"","gallery":["",""]},
          {"date":"2026 / 06","title":"一起看日落","text":"那天的晚霞特别美，但你看我的眼神更美。","img":""},
          {"date":"2026 / 07","title":"盛夏光年","text":"七月的阳光很烈，但有你在身边，连汗水都是甜的。我们的故事，还在继续......","img":"","highlight":true,"tag":"现在"},
          {"date":"2026 / 07","title":"未来的日子","text":"还有很多很多天，要和你一起走过。每一天，都是我爱你的证据。","img":""}
        ]
      };

      document.getElementById('statMemories').textContent = DATA.memories.length;

      function loadMemories(data) {
        container.innerHTML = '';
        var lastMonth = '';
        data.forEach(function (item, i) {
          var side = i % 2 === 0 ? 'left' : 'right';
          var hl = item.highlight ? ' highlight' : '';
          var parts = item.date.split('/');
          var month = parts[0].trim() + '/' + parts[1].trim();
          if (month !== lastMonth) {
            lastMonth = month;
            var mn = {'2025/10':'2025 年 10 月','2025/11':'2025 年 11 月','2025/12':'2025 年 12 月',
              '2026/01':'2026 年 1 月','2026/02':'2026 年 2 月','2026/03':'2026 年 3 月',
              '2026/04':'2026 年 4 月','2026/05':'2026 年 5 月','2026/06':'2026 年 6 月','2026/07':'2026 年 7 月'};
            container.insertAdjacentHTML('beforeend',
              '<div class="month-label"><div class="month-label-inner"><div class="month-label-dot"></div><div class="month-label-text">'+(mn[month]||month)+'</div><div class="month-label-dot"></div></div></div>');
          }

          var imgHtml = item.img
            ? '<div class="mem-card-img"><img src="'+item.img+'" loading="lazy"></div>'
            : '<div class="mem-card-img"><div class="mem-card-img-ph">&#128247;</div></div>';
          var tagHtml = item.tag ? '<div class="mem-tag">'+item.tag+'</div>' : '';

          container.insertAdjacentHTML('beforeend',
            '<div class="mem '+side+'" data-idx="'+i+'">'
            + '<div class="mem-card'+hl+'" data-idx="'+i+'">'
            + imgHtml
            + '<div class="mem-card-body">'
            + '<div class="mem-card-date">'+item.date+'</div>'
            + '<div class="mem-card-title">'+item.title+'</div>'
            + '<div class="mem-card-hint">点击查看详情 &rsaquo;</div>'
            + '</div>' + tagHtml
            + '</div><div class="mem-dot"></div><div class="mem-stem"></div></div>');
        });

        container.querySelectorAll('.mem-card').forEach(function (card) {
          card.addEventListener('click', function () {
            openModal(data[parseInt(card.dataset.idx)]);
          });
        });
      }

      // Modal
      var mask = document.getElementById('modalMask');
      function openModal(item) {
        document.getElementById('modalImg').innerHTML = item.img
          ? '<img src="'+item.img+'" alt="'+item.title+'">'
          : '<div class="modal-img-ph">&#128247;</div>';
        if (item.gallery && item.gallery.length > 0) {
          var gc = item.gallery.length >= 3 ? 'g3' : 'g2';
          var gh = '<div class="modal-gallery '+gc+'">';
          item.gallery.forEach(function (g) {
            gh += '<div class="modal-gallery-item">' + (g ? '<img src="'+g+'" loading="lazy">' : '<div class="modal-img-ph" style="font-size:18px">&#128247;</div>') + '</div>';
          });
          document.getElementById('modalGallery').innerHTML = gh + '</div>';
        } else {
          document.getElementById('modalGallery').innerHTML = '';
        }
        document.getElementById('modalDate').textContent = item.date;
        document.getElementById('modalTitle').textContent = item.title;
        document.getElementById('modalText').textContent = item.text;
        document.getElementById('modalTag').innerHTML = item.tag ? '<div class="modal-tag">'+item.tag+'</div>' : '';
        mask.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeModal() { mask.classList.remove('open'); document.body.style.overflow = ''; }
      document.getElementById('modalClose').addEventListener('click', closeModal);
      mask.addEventListener('click', function (e) { if (e.target === mask) closeModal(); });

      // Init
      (function () {
        var h = DATA.hero;
        if (h.img) {
          document.getElementById('heroPlaceholder').style.display = 'none';
          var img = document.createElement('img'); img.src = h.img; img.alt = '我们';
          document.getElementById('heroPhoto').appendChild(img);
        }
        if (h.startDate) document.getElementById('heroStartDate').textContent = h.startDate;
        if (h.quote) document.getElementById('quoteText').innerHTML = h.quote;
        if (h.startDate) START_DATE = new Date(h.startDate);
        loadMemories(DATA.memories);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { buildVine(); });
        });
      })();

      var totalLen = 0;

      function buildVine() {
        var memEls = document.querySelectorAll('.mem');
        var w = section.offsetWidth;
        var h = section.offsetHeight;
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        svg.style.width = w + 'px';
        svg.style.height = h + 'px';

        var points = [];
        memEls.forEach(function (el) {
          var card = el.querySelector('.mem-card');
          var rect = card.getBoundingClientRect();
          var sRect = section.getBoundingClientRect();
          var cy = rect.top - sRect.top + 14;
          var cx = isMobile ? 18 : (el.classList.contains('left') ? rect.right - sRect.left + 8 : rect.left - sRect.left - 8);
          points.push({ x: cx, y: cy });
        });

        if (points.length > 0) {
          points.unshift({ x: points[0].x, y: 0 });
          points.push({ x: points[points.length-1].x, y: h });
        }

        var d = 'M '+points[0].x.toFixed(1)+' '+points[0].y.toFixed(1);
        for (var j = 0; j < points.length - 1; j++) {
          var p0 = points[Math.max(0,j-1)], p1 = points[j], p2 = points[j+1], p3 = points[Math.min(points.length-1,j+2)];
          var t = 5;
          d += ' C '+(p1.x+(p2.x-p0.x)/t).toFixed(1)+' '+(p1.y+(p2.y-p0.y)/t).toFixed(1)
            +', '+(p2.x-(p3.x-p1.x)/t).toFixed(1)+' '+(p2.y-(p3.y-p1.y)/t).toFixed(1)
            +', '+p2.x.toFixed(1)+' '+p2.y.toFixed(1);
        }

        path.setAttribute('d', d);
        totalLen = path.getTotalLength();
        path.style.strokeDasharray = totalLen;
        path.style.strokeDashoffset = totalLen;

        leavesBox.innerHTML = '';
        memEls.forEach(function (el, i) {
          if (i >= points.length - 2) return;
          var pt = points[i+1];
          var side = i % 2 === 0 ? 1 : -1;
          var leaf = document.createElement('div');
          leaf.className = 'vine-leaf';
          leaf.style.left = (pt.x + side * (isMobile ? 8 : 14)) + 'px';
          leaf.style.top = pt.y + 'px';
          leaf.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#B8C9A3" stroke-width="1.5"><path d="M12 2C6 8 2 14 12 22C22 14 18 8 12 2Z"/><line x1="12" y1="8" x2="12" y2="22"/></svg>';
          leavesBox.appendChild(leaf);
        });

        var memCards = document.querySelectorAll('.mem-card');
        var memDots = document.querySelectorAll('.mem-dot');
        var memStems = document.querySelectorAll('.mem-stem');
        var leafEls = document.querySelectorAll('.vine-leaf');

        function onScroll() {
          var rect = section.getBoundingClientRect();
          var viewH = window.innerHeight;
          var scrolled = Math.max(0, -rect.top + viewH * 0.6);
          var total = rect.height;
          path.style.strokeDashoffset = totalLen * (1 - Math.min(scrolled / total, 1));
          memEls.forEach(function (item, i) {
            if (item.getBoundingClientRect().top < viewH * 0.82) {
              if (memCards[i]) memCards[i].classList.add('visible');
              if (memDots[i]) memDots[i].classList.add('visible');
              if (memStems[i]) memStems[i].classList.add('visible');
              if (leafEls[i]) leafEls[i].classList.add('visible');
            }
          });
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      }

      window.addEventListener('resize', function () {
        isMobile = window.innerWidth <= 640;
        if (document.querySelectorAll('.mem').length) buildVine();
      });
    })();

    // Progress

    // Music

      var audio = new Audio('music.mp3');
      audio.loop = true;
      audio.preload = 'auto';
      var playing = false;

      // Preload as soon as page loads
      audio.load();

      window.__playMusic = function () {
        if (playing) return;
        audio.currentTime = 0;
        audio.play().then(function () {
          playing = true;
          vinyl.classList.add('playing');
        }).catch(function (e) {
          console.log('Play blocked:', e);
        });
      };

      window.__stopMusic = function () {
        audio.pause();
        playing = false;
        vinyl.classList.remove('playing');
      };

      vinyl.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (playing) {
          window.__stopMusic();
        } else {
          window.__playMusic();
        }
      });
    })();
  </script>
</body>
</html>
